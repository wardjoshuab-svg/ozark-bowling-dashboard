<body><div class="wrap">
<div class="hero"><div><h1>Ozark Lanes OBM Bowling Analytics</h1><div class="muted" id="subtitle">Loading bowling data…</div></div><div class="heroRight"><div class="seasonCtl"><label for="seasonSel">Season</label><select id="seasonSel"></select></div><div class="status" id="loadStatus">Loading data.json…</div></div></div>

<script>
(()=>{'use strict';let D=null,C=null,BIR=null,SEASON='26/27';
const $=s=>document.querySelector(s),fmt=(n,d=1)=>n==null||!Number.isFinite(+n)?'—':(+n).toLocaleString(undefined,{maximumFractionDigits:d});
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function tbl(cols,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function metrics(items){return `<div class="grid metrics">${items.map(x=>`<div class="metric"><div class="k">${x[0]}</div><div class="v">${x[1]}</div><div class="d">${x[2]||''}</div></div>`).join('')}</div>`}
function select(id,label,options,value){return `<div class="control"><label for="${id}">${label}</label><select id="${id}">${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function sRecords(){return SEASON==='All Seasons'?D.teamRecords:D.teamRecords.filter(r=>r.season===SEASON)}function sGames(){return SEASON==='All Seasons'?D.bowlerGames:D.bowlerGames.filter(g=>g.season===SEASON)}function sOfficial(){const a=Array.isArray(D.officialStandings)?D.officialStandings:[];return SEASON==='All Seasons'?a:a.filter(r=>r.season===SEASON)}function officialLatest(){const a=sOfficial();if(SEASON==='All Seasons'||!a.length)return[];const w=Math.max(...a.map(r=>+r.week||0));return a.filter(r=>(+r.week||0)===w).slice().sort((a,b)=>(+a.place||999)-(+b.place||999))}function chron(a){return a.slice().sort((x,y)=>String(x.season).localeCompare(String(y.season))||x.week-y.week||(x.game||0)-(y.game||0))}
function computeContext(){const rs=sRecords(),gs=sGames(),gamesByBowler=new Map(),teamRec=new Map(),currentRoster=new Map();for(const r of rs)teamRec.set(`${r.season}|${r.week}|${r.team}`,r);for(const g of gs){if(g.status!=='actual')continue;if(!gamesByBowler.has(g.name))gamesByBowler.set(g.name,[]);gamesByBowler.get(g.name).push(g)}for(const [n,a] of gamesByBowler){a.sort((x,y)=>x.date.localeCompare(y.date)||x.game-y.game);const t=a[a.length-1].team;if(!currentRoster.has(t))currentRoster.set(t,[]);currentRoster.get(t).push(n)}
 const bowlerSummary=[];for(const [name,a] of gamesByBowler){const scores=a.map(g=>g.score),avg=scores.reduce((s,x)=>s+x,0)/scores.length,cons=Math.sqrt(scores.reduce((s,x)=>s+(x-avg)**2,0)/scores.length);const groups=new Map();for(const g of a){const k=`${g.season}|${g.week}`;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(g.score)}const highSeries=Math.max(...[...groups.values()].filter(x=>x.length>=3).map(x=>x.slice(0,3).reduce((s,v)=>s+v,0)),0);bowlerSummary.push({name,team:a[a.length-1].team,games:scores.length,avg,high_game:Math.max(...scores),high_series:highSeries||null,consistency:cons,latest_old_avg:a[a.length-1].old_avg})}bowlerSummary.sort((a,b)=>b.avg-a.avg);
 const teamNames=[...new Set(rs.map(r=>r.team))].sort(),teamSummary=[];const offLatest=officialLatest(),offMap=new Map(offLatest.map(r=>[r.team,r]));for(const t of teamNames){const tr=rs.filter(r=>r.team===t).sort((a,b)=>(+a.week||0)-(+b.week||0)),scratch=tr.filter(r=>Number.isFinite(+r.scratch_total)),hd=tr.filter(r=>Number.isFinite(+r.hdcp_total)),o=offMap.get(t);const fallbackPoints=tr.reduce((s,r)=>s+(+r.points||0),0);teamSummary.push({team:t,points:o?(+o.ytd_points_won||+o.points_won||0):fallbackPoints,points_lost:o?(+o.ytd_points_lost||+o.points_lost||0):null,games_won:o?+o.games_won:null,scratch_pins:o?+o.scratch_pins:null,pins_plus_hdcp:o?+o.pins_plus_hdcp:null,scratch_avg:scratch.length?scratch.reduce((s,r)=>s+(+r.scratch_total||0),0)/scratch.length:null,hdcp_avg:hd.length?hd.reduce((s,r)=>s+(+r.hdcp_total||0),0)/hd.length:null,latest_points:tr.length?+tr[tr.length-1].points||0:0,rank:o?+o.place:null,official:!!o})}if(offLatest.length){teamSummary.sort((a,b)=>(a.rank??999)-(b.rank??999)||b.points-a.points)}else{teamSummary.sort((a,b)=>b.points-a.points);teamSummary.forEach((x,i)=>x.rank=i+1)};
 const consistencyPool=bowlerSummary.filter(b=>b.games>=15&&Number.isFinite(b.consistency)).map(b=>b.consistency).sort((a,b)=>a-b);C={rs,gs,gamesByBowler,teamRec,currentRoster,bowlerSummary,summaryByBowler:new Map(bowlerSummary.map(x=>[x.name,x])),teamSummary,consistencyPool};buildBIR()}
function actualGames(name){return C.gamesByBowler.get(name)||[]}function currentTeam(name){const a=actualGames(name);return a.length?a[a.length-1].team:''}function recentAvg(name,n=9){const a=actualGames(name).slice(-n);return a.length?a.reduce((s,g)=>s+g.score,0)/a.length:null}function currentHdcp(avg){return Math.max(0,Math.floor((220-avg)*.9))}function consistencyRating(b){const q=C.consistencyPool;if(!b||b.games<15||!Number.isFinite(b.consistency)||!q.length)return null;let better=0;for(const x of q)if(x>b.consistency)better++;return Math.round(100*better/Math.max(1,q.length-1))}function projection(b){const r=recentAvg(b.name),predScratch=r==null?b.avg:.7*b.avg+.3*r,h=currentHdcp(Number.isFinite(b.latest_old_avg)?b.latest_old_avg:b.avg);return {...b,recent:r,predScratch,predHdcp:predScratch+h,currentHdcp:h,sigma:Math.max(12,b.consistency||25),consistencyRating:consistencyRating(b)}}function roster(team){let names=C.currentRoster.get(team)||[],a=names.map(n=>C.summaryByBowler.get(n)).filter(Boolean).map(projection);return a.sort((a,b)=>b.predHdcp-a.predHdcp)}
function erf(x){const s=x>=0?1:-1;x=Math.abs(x);const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911,t=1/(1+p*x);return s*(1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x))}function normcdf(z){return .5*(1+erf(z/Math.sqrt(2)))}function lineupStats(a){return {mean:a.reduce((s,b)=>s+b.predHdcp,0),variance:a.reduce((s,b)=>s+b.sigma*b.sigma,0)}}function matchup(a,b){const A=lineupStats(a),B=lineupStats(b),sd=Math.sqrt(A.variance+B.variance),p=normcdf((A.mean-B.mean)/Math.max(1,sd)),ps=normcdf((3*(A.mean-B.mean))/Math.max(1,Math.sqrt(3)*sd));return {game:p,series:ps,points:3*p+2*ps,our:A.mean,their:B.mean,sd:Math.sqrt(A.variance)}}function combinations(a,k){const out=[];function rec(i,p){if(p.length===k){out.push(p.slice());return}for(let j=i;j<=a.length-(k-p.length);j++){p.push(a[j]);rec(j+1,p);p.pop()}}rec(0,[]);return out}function bestLineup(team,opp){const r=roster(team),opp5=roster(opp).slice(0,5);if(r.length<=5)return {lineup:r.slice(0,5),m:matchup(r.slice(0,5),opp5)};let best=null;for(const c of combinations(r.slice(0,10),5)){const m=matchup(c,opp5);if(!best||m.points>best.m.points)best={lineup:c,m}}return best}
function buildBIR(){const hd=[];for(const r of C.rs)for(const x of (r.hdcp_games||[]))if(Number.isFinite(+x))hd.push(+x);const teamMean=hd.length?hd.reduce((s,x)=>s+x,0)/hd.length:1000,teamSd=hd.length?Math.sqrt(hd.reduce((s,x)=>s+(x-teamMean)**2,0)/hd.length):80;const quals=C.bowlerSummary.filter(b=>b.games>=Math.min(15,Math.max(3,Math.floor(C.gs.length/100)))).map(b=>b.avg+currentHdcp(b.latest_old_avg)).sort((a,b)=>a-b);const repl=quals.length?quals[Math.floor(.25*(quals.length-1))]:210;const summary=[];for(const b of C.bowlerSummary){const gs=actualGames(b.name),groups=new Map();for(const g of gs){const k=`${g.season}|${g.week}`;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(g)}let cum=0;const rows=[];for(const [k,a] of [...groups].sort((x,y)=>x[1][0].date.localeCompare(y[1][0].date))){const [season,w]=k.split('|'),scratchAvg=a.reduce((s,g)=>s+g.score,0)/a.length,hdcpAvg=a.reduce((s,g)=>s+g.score+g.hdcp,0)/a.length,diff=hdcpAvg-repl,pinToProb=diff/Math.max(1,teamSd),weekBir=(3*(normcdf(pinToProb)-.5)+2*(normcdf(Math.sqrt(3)*pinToProb)-.5));cum+=weekBir;rows.push({season,week:+w,scratchAvg,hdcpAvg,weekBir,cumBir:cum})}const weeks=rows.length;summary.push({name:b.name,team:currentTeam(b.name),games:b.games,weeks,bir:cum,birPerWeek:weeks?cum/weeks:0,hdcpAvg:gs.length?gs.reduce((s,g)=>s+g.score+g.hdcp,0)/gs.length:0,rows})}summary.sort((a,b)=>b.bir-a.bir);BIR={summary,repl,teamSd}}
function drawTeamChart(canvas,rows){const ctx=canvas.getContext('2d'),dpr=devicePixelRatio||1,w=Math.max(canvas.clientWidth,320),h=Math.max(canvas.clientHeight,260);canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);if(!rows.length){ctx.fillStyle='#9eabc0';ctx.font='13px system-ui';ctx.fillText('No team history available for this selection.',18,32);return}const m={l:48,r:44,t:24,b:38},W=w-m.l-m.r,H=h-m.t-m.b,maxP=Math.max(...rows.map(r=>+r.cumulative_points||0),1),maxR=Math.max(...rows.map(r=>+r.rank||1),1);ctx.strokeStyle='#29364f';ctx.fillStyle='#9eabc0';ctx.font='11px system-ui';for(let i=0;i<=4;i++){const y=m.t+H*i/4;ctx.beginPath();ctx.moveTo(m.l,y);ctx.lineTo(m.l+W,y);ctx.stroke();ctx.fillText(Math.round(maxP*(1-i/4)),5,y+4);ctx.textAlign='right';ctx.fillText(Math.max(1,Math.round(1+(maxR-1)*i/4)),w-4,y+4);ctx.textAlign='left'}const X=i=>m.l+(rows.length===1?W/2:i/(rows.length-1)*W),Yp=p=>m.t+H*(1-(+p||0)/maxP),Yr=r=>m.t+H*((+r||1)-1)/Math.max(1,maxR-1);function line(yfn,color){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2.5;ctx.beginPath();rows.forEach((r,i)=>{const x=X(i),y=yfn(r);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(rows.length>1)ctx.stroke();rows.forEach((r,i)=>{ctx.beginPath();ctx.arc(X(i),yfn(r),4,0,Math.PI*2);ctx.fill()})}line(r=>Yp(r.cumulative_points),'#54d48a');line(r=>Yr(r.rank),'#5aa7ff');ctx.fillStyle='#9eabc0';rows.forEach((r,i)=>{if(i%Math.max(1,Math.ceil(rows.length/8))===0||i===rows.length-1)ctx.fillText(r.label||('W'+r.week),X(i)-12,h-10)});ctx.fillStyle='#54d48a';ctx.fillText('Cumulative points',m.l,14);ctx.fillStyle='#5aa7ff';ctx.textAlign='right';ctx.fillText('Rank (#1 top)',w-m.r,14);ctx.textAlign='left'}
function leagueRankHistory(){
 const out=new Map();
 if(SEASON!=='All Seasons'){
  const off=sOfficial();
  if(off.length){
   for(const r of off){const t=r.team;if(!out.has(t))out.set(t,[]);out.get(t).push({season:r.season,week:+r.week,rank:+r.place,label:'W'+r.week,official:true})}
   for(const a of out.values())a.sort((x,y)=>x.week-y.week);
   return out;
  }
 }
 const rs=C.rs.slice();
 const keys=[...new Set(rs.map(r=>`${r.season}|${r.week}`))].sort((a,b)=>{const [sa,wa]=a.split('|'),[sb,wb]=b.split('|');return sa.localeCompare(sb)||+wa-+wb});
 for(const key of keys){
  const [season,w0]=key.split('|'),w=+w0;
  const through=rs.filter(r=>SEASON==='All Seasons'?((r.season<season)||(r.season===season&&(+r.week||0)<=w)):(+r.week||0)<=w);
  const totals={};for(const r of through)totals[r.team]=(totals[r.team]||0)+(+r.points||0);
  const ranked=Object.entries(totals).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  ranked.forEach(([team],i)=>{if(!out.has(team))out.set(team,[]);out.get(team).push({season,week:w,rank:i+1,label:SEASON==='All Seasons'?`${season} W${w}`:`W${w}`})});
 }
 return out;
}
function drawLeagueRankChart(canvas,focusTeam){
 const ctx=canvas.getContext('2d'),hist=leagueRankHistory(),all=[...hist.entries()].filter(([,a])=>a.length);
 const dpr=devicePixelRatio||1,w=Math.max(canvas.clientWidth,420),h=Math.max(canvas.clientHeight,360);canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
 if(!all.length){ctx.fillStyle='#9eabc0';ctx.font='13px system-ui';ctx.fillText('No weekly rank history available.',18,32);return}
 const allPts=all.flatMap(([,a])=>a),labels=[...new Map(allPts.map(r=>[`${r.season}|${r.week}`,r])).values()].sort((a,b)=>String(a.season).localeCompare(String(b.season))||a.week-b.week),maxRank=Math.max(...allPts.map(r=>+r.rank||1),1);
 const m={l:46,r:130,t:24,b:42},W=w-m.l-m.r,H=h-m.t-m.b,X=i=>m.l+(labels.length===1?W/2:i/(labels.length-1)*W),Yr=r=>m.t+H*((+r||1)-1)/Math.max(1,maxRank-1),key=r=>`${r.season}|${r.week}`,ix=new Map(labels.map((r,i)=>[key(r),i]));
 ctx.strokeStyle='#29364f';ctx.fillStyle='#9eabc0';ctx.font='11px system-ui';for(let i=0;i<=4;i++){const rank=Math.max(1,Math.round(1+(maxRank-1)*i/4)),y=Yr(rank);ctx.beginPath();ctx.moveTo(m.l,y);ctx.lineTo(m.l+W,y);ctx.stroke();ctx.fillText('#'+rank,8,y+4)}
 for(const [team,a] of all){const focus=team===focusTeam;ctx.strokeStyle=focus?'#54d48a':'rgba(158,171,192,.28)';ctx.lineWidth=focus?3:1.15;ctx.beginPath();a.forEach((r,j)=>{const x=X(ix.get(key(r))),y=Yr(r.rank);j?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(a.length>1)ctx.stroke();if(focus){ctx.fillStyle='#54d48a';a.forEach(r=>{const x=X(ix.get(key(r))),y=Yr(r.rank);ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()});const last=a[a.length-1];ctx.font='12px system-ui';ctx.fillText(`${team}  #${last.rank}`,m.l+W+8,Yr(last.rank)+4)}}

function initLineup(){const teams=C.teamSummary.map(x=>x.team).filter(t=>roster(t).length>=5).sort();$('#lineup').innerHTML=`<div class="controls">${select('labTeam','Your team',teams,teams[0])}${select('labOpp','Opponent',teams,teams[1])}</div><div id="labMetrics"></div><div class="grid split"><div class="card"><h2>Recommended five</h2><div id="labFive"></div></div><div class="card"><h2>Roster matchup importance</h2><div id="labRank"></div></div></div>`;function render(){const t=$('#labTeam').value,o=$('#labOpp').value;if(!t||!o||t===o)return;const best=bestLineup(t,o),r=roster(t);if(!best||best.lineup.length<5){$('#labMetrics').innerHTML='<div class="card muted">Not enough roster history for a five-bowler projection.</div>';return}const base=best.m.points,importance=r.map(b=>{const repl=r.filter(x=>x.name!==b.name).slice(0,5);const imp=best.lineup.some(x=>x.name===b.name)&&repl.length===5?Math.max(0,base-matchup(repl,roster(o).slice(0,5)).points):0;return {...b,importance:imp}}).sort((a,b)=>b.importance-a.importance||b.predHdcp-a.predHdcp);$('#labMetrics').innerHTML=metrics([['Expected match points',best.m.points.toFixed(2)+' / 5',`${(best.m.game*100).toFixed(1)}% game win`],['Series win probability',(best.m.series*100).toFixed(1)+'%','Model estimate'],['Projected HDCP',fmt(best.m.our),`Opponent ${fmt(best.m.their)}`],['Lineup volatility',fmt(best.m.sd),'Lower = steadier']]);$('#labFive').innerHTML=tbl([['Bowler',x=>esc(x.name)],['Avg',x=>fmt(x.avg)],['Recent 9',x=>fmt(x.recent)],['Proj HDCP',x=>fmt(x.predHdcp)]],best.lineup);$('#labRank').innerHTML=tbl([['Bowler',x=>esc(x.name)],['Importance',x=>x.importance.toFixed(3)],['Proj HDCP',x=>fmt(x.predHdcp)],['Consistency',x=>x.consistencyRating??'—']],importance)}function sync(){const t=$('#labTeam').value;[...$('#labOpp').options].forEach(o=>o.disabled=o.value===t);if($('#labOpp').value===t)$('#labOpp').value=teams.find(x=>x!==t)||'';render()}$('#labTeam').addEventListener('change',sync);$('#labOpp').addEventListener function initSimulator(){const teams=C.teamSummary.map(x=>x.team).filter(t=>roster(t).length>=5).sort();$('#sim').innerHTML=`<div class="controls">${select('simTeam','Your team',teams,teams[0])}${select('simOpp','Opponent',teams,teams[1])}</div><div id="simMetrics"></div><div class="card"><h2>Select five bowlers</h2><div class="bowlerlist" id="simRoster"></div><div class="note">Select up to five bowlers. Projection updates automatically.</div></div>`;function populate(){const r=roster($('#simTeam').value);$('#simRoster').innerHTML=`<div class="bowlerrow head"><span></span><span>Bowler</span><span>Avg</span><span>Recent 9</span><span class="hide-sm">HDCP</span><span class="hide-sm">Proj</span></div>`+r.map((b,i)=>`<label class="bowlerrow"><input type="checkbox" name="simBowler" value="${esc(b.name)}" ${i<5?'checked':''}><span>${esc(b.name)}</span><span>${fmt(b.avg)}</span><span>${fmt(b.recent)}</span><span class="hide-sm">${b.currentHdcp}</span><span class="hide-sm">${fmt(b.predHdcp)}</span></label>`).join('');render()}function selected(){const set=new Set([...document.querySelectorAll('input[name="simBowler"]:checked')].map(x=>x.value));return roster($('#simTeam').value).filter(b=>set.has(b.name))}function render(){const a=selected(),o=roster($('#simOpp').value).slice(0,5);if(a.length!==5||o.length!==5){$('#simMetrics').innerHTML=metrics([['Selected',a.length+' / 5','Choose exactly five bowlers'],['Expected points','—','Requires five'],['Series win','—','Requires five'],['Projected HDCP','—','Requires five']]);return}const m=matchup(a,o);$('#simMetrics').innerHTML=metrics([['Expected match points',m.points.toFixed(2)+' / 5',`${(m.game*100).toFixed(1)}% game win`],['Series win probability',(m.series*100).toFixed(1)+'%','Model estimate'],['Projected HDCP',fmt(m.our),`Opponent ${fmt(m.their)}`],['Lineup volatility',fmt(m.sd),'Estimated team σ']])}function teamChange(){const t=$('#simTeam').value;[...$('#simOpp').options].forEach(o=>o.disabled=o.value===t);if($('#simOpp').value===t)$('#simOpp').value=teams.find(x=>x!==t)||'';populate()}$('#simTeam').addEventListener('change',teamChange);$('#simOpp').addEventListener('change',render);$('#simRoster').addEventListener('change',e=>{if(e.target.name==='simBowler'){const checked=document.querySelectorAll('input[name="simBowler"]:checked');if(checked.length>5)e.target.checked=false;render()}});teamChange()}
function birOurTeam(){return C.teamSummary.map(x=>x.team).find(t=>String(t).toLowerCase().includes("parker's window"))||C.teamSummary.map(x=>x.team).find(t=>String(t).toLowerCase().includes('parker'))||C.teamSummary[0]?.team||''}
function drawTeamBIRChart(canvas,metric){
 const team=birOurTeam(),people=BIR.summary.filter(b=>b.team===team),ctx=canvas.getContext('2d'),dpr=devicePixelRatio||1,w=Math.max(canvas.clientWidth,420),h=Math.max(canvas.clientHeight,340);canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
 if(!people.length){ctx.fillStyle='#9eabc0';ctx.font='13px system-ui';ctx.fillText('No BIR history available for '+team+'.',18,32);return}
 const seasonRows=C.rs.filter(r=>r.team===team).sort((a,b)=>String(a.season||'').localeCompare(String(b.season||''))||(+a.week||0)-(+b.week||0)),weekKeys=[...new Map(seasonRows.map(r=>[`${r.season}|${r.week}`,{season:r.season,week:+r.week,label:SEASON==='All Seasons'?`${r.season} W${r.week}`:`W${r.week}`}])).values()];
 if(!weekKeys.length){ctx.fillStyle='#9eabc0';ctx.font='13px system-ui';ctx.fillText('No weekly team history available.',18,32);return}
 const rowsByPerson=new Map();for(const b of people){const m=new Map(b.rows.map(r=>[`${r.season}|${r.week}`,r]));let carry=0,started=false;rowsByPerson.set(b.name,weekKeys.map(k=>{const r=m.get(`${k.season}|${k.week}`);if(r){carry=r.cumBir;started=true;return {...k,value:metric==='cumBir'?r.cumBir:r.weekBir,played:true}}return {...k,value:metric==='cumBir'&&started?carry:null,played:false}}))}
 const vals=[...rowsByPerson.values()].flat().map(r=>r.value).filter(v=>Number.isFinite(+v)).map(Number);if(!vals.length)return;let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}else{const pad=(max-min)*.12;min-=pad;max+=pad}if(min>0)min=0;if(max<0)max=0;
 const m={l:58,r:145,t:26,b:44},W=w-m.l-m.r,H=h-m.t-m.b,X=i=>m.l+(weekKeys.length===1?W/2:i/(weekKeys.length-1)*W),Y=v=>m.t+H*(max-v)/(max-min||1),palette=['#54d48a','#5aa7ff','#f3bb4f','#ff6b7a','#c084fc','#22d3ee','#fb923c','#a3e635'];
 ctx.strokeStyle='#29364f';ctx.fillStyle='#9eabc0';ctx.font='11px system-ui';for(let i=0;i<=4;i++){const v=max-(max-min)*i/4,y=Y(v);ctx.beginPath();ctx.moveTo(m.l,y);ctx.lineTo(m.l+W,y);ctx.stroke();ctx.fillText(v.toFixed(2),6,y+4)}if(min<0&&max>0){ctx.strokeStyle='rgba(245,247,251,.35)';ctx.beginPath();ctx.moveTo(m.l,Y(0));ctx.lineTo(m.l+W,Y(0));ctx.stroke()}
 people.forEach((b,bi)=>{const a=rowsByPerson.get(b.name),color=palette[bi%palette.length];ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2.4;let drawing=false;ctx.beginPath();a.forEach((r,i)=>{if(!Number.isFinite(+r.value)){if(metric==='weekBir')drawing=false;return}const x=X(i),y=Y(+r.value);if(!drawing){ctx.moveTo(x,y);drawing=true}else ctx.lineTo(x,y)});ctx.stroke();a.forEach((r,i)=>{if(!Number.isFinite(+r.value)||(!r.played&&metric==='cumBir'))return;ctx.beginPath();ctx.arc(X(i),Y(+r.value),3.5,0,Math.PI*2);ctx.fill()});const last=[...a].reverse().find(r=>Number.isFinite(+r.value));if(last){ctx.font='11px system-ui';ctx.fillText(b.name,m.l+W+10,Y(+last.value)+4)}});
 ctx.fillStyle='#9eabc0';ctx.font='11px system-ui';weekKeys.forEach((r,i)=>ctx.fillText(r.label,X(i)-12,h-12));ctx.fillStyle='#f5f7fb';ctx.font='12px system-ui';ctx.fillText(metric==='cumBir'?'Cumulative BIR':'Weekly BIR',m.l,15);ctx.fillStyle='#9eabc0';ctx.textAlign='right';ctx.fillText(team,w-8,15);ctx.textAlign='left';
}
function initBIR(){const teams=C.teamSummary.map(x=>x.team).sort(),ourTeam=birOurTeam();$('#bir').innerHTML=`<div class="card"><div class="controls"><div class="control"><label for="birChartMetric">Parker's Window BIR chart</label><select id="birChartMetric"><option value="weekBir">Weekly BIR</option><option value="cumBir">Cumulative BIR</option></select></div></div><div class="chartbox" style="height:380px"><canvas id="birTeamChart"></canvas></div><div class="note">Week is shown on the x-axis. The y-axis switches between each bowler's weekly BIR contribution and running cumulative BIR. Cumulative BIR carries forward through weeks a bowler did not bowl; weekly BIR leaves those weeks blank.</div></div><div class="controls">${select('birTeam','Team',['All teams',...teams],ourTeam||'All teams')}<div class="control"><label for="birBowler">Bowler</label><select id="birBowler"></select></div></div><div id="birMetrics"></div><div class="grid split"><div class="card"><h2>Selected bowler BIR by week</h2><div id="birHistory"></div></div><div class="card"><h2>Team BIR ranking</h2><div id="birTeamRank"></div></div></div><div class="card"><h2>League BIR leaderboard</h2><div id="birLeague"></div></div>`;function filtered(){const t=$('#birTeam').value;return BIR.summary.filter(b=>t==='All teams'||b.team===t)}function draw(){drawTeamBIRChart($('#birTeamChart'),$('#birChartMetric').value)}function populate(){const list=filtered();$('#birBowler').innerHTML=list.map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');render()}function render(){const list=filtered(),b=list.find(x=>x.name===$('#birBowler').value)||list[0];if(!b){$('#birMetrics').innerHTML='<div class="card muted">No bowler data in this selection.</div>';return}const rank=BIR.summary.findIndex(x=>x.name===b.name)+1;$('#birMetrics').innerHTML=metrics([['BIR',b.bir.toFixed(2),`#${rank} selected period`],['BIR / Week',b.birPerWeek.toFixed(3),`${b.weeks} weeks`],['HDCP performance',fmt(b.hdcpAvg),`${fmt(b.hdcpAvg-BIR.repl)} vs replacement`],['Playing time',b.games+' games',`${b.weeks} weeks`]]);$('#birHistory').innerHTML=tbl([['Season',r=>r.season],['Week',r=>'W'+r.week],['Scratch Avg',r=>fmt(r.scratchAvg)],['HDCP Avg',r=>fmt(r.hdcpAvg)],['Weekly BIR',r=>r.weekBir.toFixed(3)],['Cum BIR',r=>r.cumBir.toFixed(3)]],b.rows);$('#birTeamRank').innerHTML=tbl([['Bowler',r=>esc(r.name)],['BIR',r=>r.bir.toFixed(2)],['BIR/Wk',r=>r.birPerWeek.toFixed(3)],['Weeks',r=>r.weeks]],list.slice().sort((a,b)=>b.bir-a.bir));$('#birLeague').innerHTML=tbl([['Rank',r=>r.rank],['Bowler',r=>esc(r.name)],['Team',r=>esc(r.team)],['BIR',r=>r.bir.toFixed(2)],['BIR/Wk',r=>r.birPerWeek.toFixed(3)],['Weeks',r=>r.weeks]],BIR.summary.map((r,i)=>({...r,rank:i+1})))}$('#birChartMetric').addEventListener('change',draw);$('#birTeam').addEventListener('change',populate);$('#birBowler').addEventListener('change',render);populate();requestAnimationFrame(draw)}
function buildWinPct(){const out=[];for(const b of C.bowlerSummary){const seen=new Map();for(const g of actualGames(b.name)){const k=`${g.season}|${g.week}`;if(!seen.has(k))seen.set(k,g)}let w=0,l=0,t=0,pts=0,n=0;for(const g of seen.values()){const r=C.teamRec.get(`${g.season}|${g.week}|${g.team}`);if(!r)continue;const p=+r.points;pts+=p;n++;if(p>2.5)w++;else if(p<2.5)l++;else t++}if(n)out.push({name:b.name,team:currentTeam(b.name),wins:w,losses:l,ties:t,matches:n,winPct:100*(w+.5*t)/n,avgPoints:pts/n,avg:b.avg,bir:BIR.summary.find(x=>x.name===b.name)?.bir||0})}return out.sort((a,b)=>b.winPct-a.winPct||b.matches-a.matches)}
function initWinPct(){const W=buildWinPct(),teams=C.teamSummary.map(x=>x.team).sort();$('#winpct').innerHTML=`<div class="controls">${select('winTeam','Team',['All teams',...teams],'All teams')}</div><div class="card"><h2>Bowler match win percentage</h2><div id="winTable"></div><div class="note">A match counts when the bowler recorded at least one actual game. Win = team earned more than 2.5 points; tie = 2.5 points.</div></div>`;function render(){const t=$('#winTeam').value,a=W.filter(x=>t==='All teams'||x.team===t);$('#winTable').innerHTML=tbl([['Rank',r=>r.rank],['Bowler',r=>esc(r.name)],['Team',r=>esc(r.team)],['Win %',r=>`<b>${r.winPct.toFixed(1)}%</b>`],['W-L-T',r=>`${r.wins}-${r.losses}-${r.ties}`],['Matches',r=>r.matches],['Avg Team Pts',r=>r.avgPoints.toFixed(2)],['Avg',r=>fmt(r.avg)],['BIR',r=>r.bir.toFixed(2)]],a.map((r,i)=>({...r,rank:i+1})))}$('#winTeam').addEventListener('change',render);render()}
function initMethod(){$('#method').innerHTML=`<div class="card"><h2>Methodology</h2><p class="muted">Use the season selector at the top to analyze 2025–26, 2026–27, or all available seasons. For 2026–27, published BLS Interactive Standings are the authoritative source for place, cumulative points, games won, scratch pins and pins plus handicap. This preserves league corrections and adjustments that are not recoverable by simply adding weekly recap points.</p><p class="muted">The Review of Last Week tab uses the published matchup table: lanes, three handicap games, handicap series and match points. The High Scores tab uses the published Last Week's Top Scores and Season High Scores sections. Actual bowler games still come from recap/roster detail and exclude absent, vacant, and zero/no-game scores.</p><p class="muted">Consistency uses population standard deviation of actual games. Projections blend 70% selected-period average with 30% recent-nine average and add current estimated handicap. BIR is cumulative expected match-point contribution above a replacement-level handicap-adjusted bowler.</p><p class="muted">The GitHub Pages build loads the database from <code>data.json</code>, so future weekly updates normally require replacing that file with the newly processed version.</p></div>`}
const inits={overview:renderOverview,teams:initTeams,bowlers:initBowlers,weekly:initWeekly,review:initReview,highscores:initHighScores,recap:initRecap,lineup:initLineup,sim:initSimulator,bir:initBIR,winpct:initWinPct,method:initMethod};function initTab(name){const sec=$('#'+name);if(sec.dataset.ready)return;sec.dataset.ready='1';inits[name]?.()}function activePane(){return document.querySelector('.tab.active')?.dataset.pane||'overview'}function refreshAll(){computeContext();document.querySelectorAll('.pane').forEach(x=>{x.dataset.ready='';x.innerHTML=''});const maxWeek=SEASON==='All Seasons'?'multi-season':Math.max(...C.rs.map(r=>r.week),0)+' week'+(Math.max(...C.rs.map(r=>r.week),0)===1?'':'s');$('#subtitle').textContent=`${D.meta.center} • ${SEASON} • ${maxWeek} • Through ${D.meta.through}`;$('#loadStatus').textContent=`${C.gs.filter(g=>g.status==='actual').length.toLocaleString()} actual games`;initTab(activePane())}function setupTabs(){document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===b.dataset.pane));initTab(b.dataset.pane)}))}
async function start(){try{const r=await fetch('./data.json',{cache:'no-store'});if(!r.ok)throw new Error(`Could not load data.json (${r.status})`);D=await r.json();const seasons=Array.isArray(D.meta?.seasons)&&D.meta.seasons.length?D.meta.seasons:[...new Set((D.teamRecords||[]).map(x=>x.season||'25/26'))].sort();D.meta=D.meta||{};D.meta.seasons=seasons;SEASON=D.meta.latest_season||seasons.at(-1)||'All Seasons';$('#seasonSel').innerHTML=[...seasons,'All Seasons'].map(s=>`<option value="${s}" ${s===SEASON?'selected':''}>${s}</option>`).join('');$('#seasonSel').addEventListener('change',()=>{SEASON=$('#seasonSel').value;refreshAll()});$('#startup').remove();setupTabs();refreshAll()}catch(e){$('#startup').className='card error';$('#startup').textContent='Dashboard data could not be loaded. Make sure index.html and data.json are in the same GitHub repository folder.\n\n'+e.message;$('#loadStatus').textContent='Load failed';console.error(e)}}start();})();
