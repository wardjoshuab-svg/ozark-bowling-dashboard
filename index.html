<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ozark Lanes OBM Bowling Analytics</title>
<style>
:root{--bg:#0b1020;--panel:#121a2b;--panel2:#182238;--text:#f5f7fb;--muted:#9eabc0;--line:#29364f;--accent:#54d48a;--accent2:#5aa7ff;--warn:#f3bb4f;--bad:#ff6b7a}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}button,select,input{font:inherit}.wrap{max-width:1500px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:16px}.hero h1{margin:0;font-size:28px}.muted{color:var(--muted)}.status{padding:8px 11px;border:1px solid var(--line);background:var(--panel);border-radius:10px;color:var(--muted);font-size:13px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 11px;border-radius:9px;cursor:pointer}.tab.active{background:var(--accent);color:#06130c;border-color:var(--accent)}.pane{display:none}.pane.active{display:block}.grid{display:grid;gap:12px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:12px}.metric,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.metric{padding:14px}.metric .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.metric .v{font-size:24px;font-weight:700;margin:5px 0}.metric .d{font-size:12px;color:var(--muted)}.card{padding:14px;margin-bottom:12px}.card h2,.card h3{margin:0 0 10px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.control{min-width:190px;flex:1}.control label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.control select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:8px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.table th:first-child,.table td:first-child,.table th:nth-child(2),.table td:nth-child(2){text-align:left}.table th{position:sticky;top:0;background:var(--panel2);color:var(--muted);z-index:1}.chartbox{height:330px;position:relative}.chartbox canvas{width:100%;height:100%}.split{grid-template-columns:1.2fr .8fr}.bowlerlist{display:grid;gap:5px}.bowlerrow{display:grid;grid-template-columns:20px minmax(150px,1.8fr) repeat(4,minmax(70px,.7fr));align-items:center;gap:8px;padding:7px 8px;border-bottom:1px solid var(--line);font-size:13px}.bowlerrow.head{color:var(--muted);font-size:12px;font-weight:700}.bowlerrow input[type=checkbox]{width:14px!important;height:14px!important;min-width:14px!important;margin:0}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:rgba(84,212,138,.12);color:var(--accent);font-size:12px}.loading{padding:28px;text-align:center;color:var(--muted)}.error{color:var(--bad);white-space:pre-wrap}.note{font-size:12px;color:var(--muted);margin-top:8px}.bars .barrow{display:grid;grid-template-columns:190px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:13px}.track{height:10px;background:var(--panel2);border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--accent)}@media(max-width:900px){.metrics,.split{grid-template-columns:1fr 1fr}.bowlerrow{grid-template-columns:20px minmax(130px,1fr) repeat(2,70px)}.hide-sm{display:none}}@media(max-width:600px){.wrap{padding:10px}.hero{display:block}.metrics,.split{grid-template-columns:1fr 1fr}.metric .v{font-size:20px}.control{min-width:150px}.bars .barrow{grid-template-columns:120px 1fr 55px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><div><h1>Ozark Lanes OBM Bowling Analytics</h1><div class="muted" id="subtitle">Loading season data…</div></div><div class="status" id="loadStatus">Loading data.json…</div></div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-pane="overview">Overview</button><button class="tab" data-pane="teams">Teams</button><button class="tab" data-pane="bowlers">Bowlers</button><button class="tab" data-pane="weekly">Weekly Results</button><button class="tab" data-pane="lineup">Lineup Lab</button><button class="tab" data-pane="sim">Matchup Simulator</button><button class="tab" data-pane="bir">BIR / WAR</button><button class="tab" data-pane="winpct">Bowler Win %</button><button class="tab" data-pane="method">Methodology</button>
  </div>
  <div id="startup" class="card loading">Loading bowling data…</div>
  <section id="overview" class="pane active"></section><section id="teams" class="pane"></section><section id="bowlers" class="pane"></section><section id="weekly" class="pane"></section><section id="lineup" class="pane"></section><section id="sim" class="pane"></section><section id="bir" class="pane"></section><section id="winpct" class="pane"></section><section id="method" class="pane"></section>
</div>
<script>
(()=>{
'use strict';
let D=null, IDX=null, BIR=null;
const $=s=>document.querySelector(s); const fmt=(n,d=1)=>n==null||!Number.isFinite(+n)?'—':(+n).toLocaleString(undefined,{maximumFractionDigits:d});
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function tbl(cols,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function metrics(items){return `<div class="grid metrics">${items.map(x=>`<div class="metric"><div class="k">${x[0]}</div><div class="v">${x[1]}</div><div class="d">${x[2]||''}</div></div>`).join('')}</div>`}
function select(id,label,options,value){return `<div class="control"><label for="${id}">${label}</label><select id="${id}">${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function teamWeeks(team){return IDX.teamWeeks.get(team)||[]}
function actualGames(name){return IDX.gamesByBowler.get(name)||[]}
function currentTeam(name){const a=actualGames(name);return a.length?a[a.length-1].team:(IDX.summaryByBowler.get(name)?.team||'')}
function recentAvg(name,n=9){const a=actualGames(name).slice(-n);return a.length?a.reduce((s,g)=>s+g.score,0)/a.length:null}
function currentHdcp(avg){return Math.max(0,Math.floor((220-avg)*.9))}
function consistencyRating(b){const q=IDX.consistencyPool;if(!b||!Number.isFinite(b.consistency)||!q.length)return null;let better=0;for(const x of q)if(x>b.consistency)better++;return Math.round(100*better/Math.max(1,q.length-1))}
function projection(b){const r=recentAvg(b.name),predScratch=r==null?b.avg:.7*b.avg+.3*r,h=currentHdcp(Number.isFinite(b.latest_old_avg)?b.latest_old_avg:b.avg);return {...b,recent:r,predScratch,predHdcp:predScratch+h,currentHdcp:h,sigma:Math.max(12,b.consistency||25),consistencyRating:consistencyRating(b)}}
function roster(team){const names=IDX.currentRoster.get(team)||[];let a=names.map(n=>IDX.summaryByBowler.get(n)).filter(Boolean).map(projection);if(a.length<5)a=D.bowlerSummary.filter(b=>b.team.split(' / ').includes(team)).map(projection);return a.sort((a,b)=>b.predHdcp-a.predHdcp)}
function erf(x){const s=x>=0?1:-1;x=Math.abs(x);const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911,t=1/(1+p*x);return s*(1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x))}
function normcdf(z){return .5*(1+erf(z/Math.sqrt(2)))}
function lineupStats(a){return {mean:a.reduce((s,b)=>s+b.predHdcp,0),scratch:a.reduce((s,b)=>s+b.predScratch,0),variance:a.reduce((s,b)=>s+b.sigma*b.sigma,0)}}
function matchup(a,b){const A=lineupStats(a),B=lineupStats(b),sd=Math.sqrt(A.variance+B.variance),p=normcdf((A.mean-B.mean)/Math.max(1,sd)),ps=normcdf((3*(A.mean-B.mean))/Math.max(1,Math.sqrt(3)*sd));return {game:p,series:ps,points:3*p+2*ps,our:A.mean,their:B.mean,sd:Math.sqrt(A.variance)}}
function combinations(a,k){const out=[];function rec(i,p){if(p.length===k){out.push(p.slice());return}for(let j=i;j<=a.length-(k-p.length);j++){p.push(a[j]);rec(j+1,p);p.pop()}}rec(0,[]);return out}
function bestLineup(team,opp){const r=roster(team),or=roster(opp);const opp5=or.slice(0,5);if(r.length<=5)return {lineup:r.slice(0,5),m:matchup(r.slice(0,5),opp5)};let best=null;for(const c of combinations(r.slice(0,10),5)){const m=matchup(c,opp5);if(!best||m.points>best.m.points)best={lineup:c,m}}return best}
function buildIndexes(){
 const teamWeeksMap=new Map(), teamRec=new Map(), gamesByBowler=new Map(), summaryByBowler=new Map(), currentRoster=new Map();
 for(const r of D.teamWeek){if(!teamWeeksMap.has(r.team))teamWeeksMap.set(r.team,[]);teamWeeksMap.get(r.team).push(r)} for(const a of teamWeeksMap.values())a.sort((x,y)=>x.week-y.week);
 for(const r of D.teamRecords)teamRec.set(`${r.week}|${r.team}`,r);
 for(const b of D.bowlerSummary)summaryByBowler.set(b.name,b);
 for(const g of D.bowlerGames){if(g.status!=='actual')continue;if(!gamesByBowler.has(g.name))gamesByBowler.set(g.name,[]);gamesByBowler.get(g.name).push(g)}
 for(const [n,a] of gamesByBowler){a.sort((x,y)=>x.week-y.week||x.game-y.game);const t=a[a.length-1].team;if(!currentRoster.has(t))currentRoster.set(t,[]);currentRoster.get(t).push(n)}
 const consistencyPool=D.bowlerSummary.filter(b=>b.games>=15&&Number.isFinite(b.consistency)).map(b=>b.consistency).sort((a,b)=>a-b);
 IDX={teamWeeks:teamWeeksMap,teamRec,gamesByBowler,summaryByBowler,currentRoster,consistencyPool};
}
function buildBIR(){
 const teamHdcp=[];for(const r of D.teamRecords)if(r.hdcp_games)for(const x of r.hdcp_games)if(Number.isFinite(x))teamHdcp.push(x);const mean=teamHdcp.reduce((s,x)=>s+x,0)/teamHdcp.length;const teamSd=Math.sqrt(teamHdcp.reduce((s,x)=>s+(x-mean)**2,0)/teamHdcp.length)||80;
 const qualified=D.bowlerSummary.filter(b=>b.games>=15).map(b=>{const gs=actualGames(b.name);return gs.length?gs.reduce((s,g)=>s+g.score+g.hdcp,0)/gs.length:null}).filter(Number.isFinite).sort((a,b)=>a-b);const repl=qualified[Math.floor(.25*Math.max(0,qualified.length-1))]||214;
 const summary=[];for(const b of D.bowlerSummary){const gs=actualGames(b.name);if(!gs.length)continue;const byWeek=new Map();for(const g of gs){if(!byWeek.has(g.week))byWeek.set(g.week,[]);byWeek.get(g.week).push(g)}let cum=0,pins=0;const rows=[];for(const [w,a] of [...byWeek].sort((x,y)=>x[0]-y[0])){const scratch=a.reduce((s,g)=>s+g.score,0)/a.length,hd=a.reduce((s,g)=>s+g.score+g.hdcp,0)/a.length,diff=hd-repl;pins+=diff*a.length;const z=diff/(teamSd/Math.sqrt(5));const delta=(normcdf(z)-.5)*5;cum+=delta;rows.push({week:w,scratchAvg:scratch,hdcpAvg:hd,pinDiff:diff,weekBir:delta,cumBir:cum})}summary.push({name:b.name,team:currentTeam(b.name),bir:cum,birPerWeek:cum/byWeek.size,weeks:byWeek.size,games:gs.length,hdcpAvg:gs.reduce((s,g)=>s+g.score+g.hdcp,0)/gs.length,pinsAboveReplacement:pins,rows})}summary.sort((a,b)=>b.bir-a.bir);BIR={summary,repl,teamSd};
}
function renderOverview(){const top=D.teamSummary.slice().sort((a,b)=>a.rank-b.rank);const qb=D.bowlerSummary.filter(b=>b.games>=15).sort((a,b)=>b.avg-a.avg);$('#overview').innerHTML=metrics([['Weeks',D.meta.weeks,`Through ${D.meta.through}`],['Teams',D.teamSummary.length,'League teams'],['Bowlers',D.bowlerSummary.length,'Season participants'],['Actual games',D.bowlerGames.filter(g=>g.status==='actual').length.toLocaleString(),'Absent/vacant excluded']])+`<div class="grid split"><div class="card"><h2>Current standings</h2>${tbl([['Rank',r=>r.rank],['Team',r=>esc(r.team)],['Points',r=>fmt(r.points)]],top.slice(0,15))}</div><div class="card"><h2>Top qualified averages</h2>${tbl([['Bowler',r=>esc(r.name)],['Team',r=>esc(currentTeam(r.name))],['Avg',r=>fmt(r.avg)],['Games',r=>r.games]],qb.slice(0,15))}</div></div>`}
function drawDualChart(canvas,rows){const ctx=canvas.getContext('2d'),dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const m={l:48,r:44,t:18,b:34},W=w-m.l-m.r,H=h-m.t-m.b;if(!rows.length)return;const maxP=Math.max(...rows.map(r=>r.cumulative_points),1),maxR=Math.max(...rows.map(r=>r.rank),1),minW=Math.min(...rows.map(r=>r.week)),maxW=Math.max(...rows.map(r=>r.week));ctx.strokeStyle='#29364f';ctx.fillStyle='#9eabc0';ctx.font='11px system-ui';ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=m.t+H*i/4;ctx.beginPath();ctx.moveTo(m.l,y);ctx.lineTo(m.l+W,y);ctx.stroke();ctx.fillText(Math.round(maxP*(1-i/4)),5,y+4);ctx.textAlign='right';ctx.fillText(Math.max(1,Math.round(1+(maxR-1)*i/4)),w-4,y+4);ctx.textAlign='left'}const X=wk=>m.l+(wk-minW)/Math.max(1,maxW-minW)*W,Yp=p=>m.t+H*(1-p/maxP),Yr=r=>m.t+H*(r-1)/Math.max(1,maxR-1);function line(yfn,color){ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();rows.forEach((r,i)=>{const x=X(r.week),y=yfn(r);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}line(r=>Yp(r.cumulative_points),'#54d48a');line(r=>Yr(r.rank),'#5aa7ff');ctx.fillStyle='#9eabc0';for(const r of rows.filter((_,i)=>i%Math.ceil(rows.length/8)===0||_.week===maxW)){ctx.fillText('W'+r.week,X(r.week)-8,h-10)}ctx.fillStyle='#54d48a';ctx.fillText('Cumulative points',m.l,12);ctx.fillStyle='#5aa7ff';ctx.textAlign='right';ctx.fillText('Rank (#1 top)',w-m.r,12);ctx.textAlign='left'}
function initTeams(){const teams=D.teamSummary.map(x=>x.team).sort();$('#teams').innerHTML=`<div class="controls">${select('teamSel','Team',teams,teams[0])}</div><div id="teamMetrics"></div><div class="card"><h2>Cumulative points & weekly rank</h2><div class="chartbox"><canvas id="teamChart"></canvas></div></div><div class="card"><h2>Weekly history</h2><div id="teamTable"></div></div>`;function render(){const t=$('#teamSel').value,s=D.teamSummary.find(x=>x.team===t),rows=teamWeeks(t);$('#teamMetrics').innerHTML=metrics([['Current rank','#'+s.rank,`${fmt(s.points)} points`],['Scratch series avg',fmt(s.scratch_avg),'Season average'],['HDCP series avg',fmt(s.hdcp_avg),'Season average'],['Latest week points',fmt(s.latest_points),'Most recent recorded week']]);drawDualChart($('#teamChart'),rows);$('#teamTable').innerHTML=tbl([['Week',r=>'W'+r.week],['Week Pts',r=>fmt(r.week_points)],['Cumulative',r=>fmt(r.cumulative_points)],['Rank',r=>'#'+r.rank]],rows)}$('#teamSel').addEventListener('change',render);render();window.addEventListener('resize',()=>drawDualChart($('#teamChart'),teamWeeks($('#teamSel').value)))}
function initBowlers(){const names=D.bowlerSummary.map(x=>x.name).sort();$('#bowlers').innerHTML=`<div class="controls">${select('bowlerSel','Bowler',names,names[0])}</div><div id="bowlerMetrics"></div><div class="card"><h2>Performance over time</h2><div id="bowlerTrend"></div></div><div class="card"><h2>Game history</h2><div id="bowlerGames"></div></div>`;function render(){const n=$('#bowlerSel').value,b=IDX.summaryByBowler.get(n),gs=actualGames(n);const cr=consistencyRating(b);$('#bowlerMetrics').innerHTML=metrics([['Average',fmt(b.avg),`${b.games} actual games`],['High game',b.high_game,'Season high'],['High series',b.high_series,'Season high'],['Consistency',cr==null?'—':cr+'/100',`σ ${fmt(b.consistency)}`]]);const weeks=new Map();for(const g of gs){if(!weeks.has(g.week))weeks.set(g.week,[]);weeks.get(g.week).push(g.score)}const rows=[...weeks].map(([w,a])=>({week:w,avg:a.reduce((s,x)=>s+x,0)/a.length,series:a.reduce((s,x)=>s+x,0)}));$('#bowlerTrend').innerHTML=tbl([['Week',r=>'W'+r.week],['Weekly Avg',r=>fmt(r.avg)],['Series',r=>r.series]],rows);$('#bowlerGames').innerHTML=tbl([['Week',r=>'W'+r.week],['Team',r=>esc(r.team)],['Opponent',r=>esc(r.opponent)],['Game',r=>r.game],['Score',r=>r.score],['HDCP',r=>r.hdcp]],gs)}$('#bowlerSel').addEventListener('change',render);render()}
function initWeekly(){const weeks=[...new Set(D.teamWeek.map(r=>r.week))].sort((a,b)=>a-b);let def=weeks[weeks.length-1];if(D.teamWeek.filter(r=>r.week===def).every(r=>+r.week_points===0)&&weeks.length>1)def=weeks[weeks.length-2];$('#weekly').innerHTML=`<div class="controls">${select('weekSel','Week',weeks.map(String),String(def))}</div><div class="card"><h2>Team results</h2><div id="weekTeams"></div></div><div class="card"><h2>Top individual games</h2><div id="weekBowlers"></div></div>`;function render(){const w=+$('#weekSel').value,tr=D.teamWeek.filter(r=>r.week===w).sort((a,b)=>b.week_points-a.week_points||a.rank-b.rank);const br=D.bowlerGames.filter(g=>g.week===w&&g.status==='actual').sort((a,b)=>b.score-a.score);$('#weekTeams').innerHTML=tbl([['Team',r=>esc(r.team)],['Week Pts',r=>fmt(r.week_points)],['Cumulative',r=>fmt(r.cumulative_points)],['Rank',r=>'#'+r.rank],['Scratch Series',r=>fmt(IDX.teamRec.get(`${w}|${r.team}`)?.scratch_total)],['HDCP Series',r=>fmt(IDX.teamRec.get(`${w}|${r.team}`)?.hdcp_total)]],tr);$('#weekBowlers').innerHTML=tbl([['Bowler',r=>esc(r.name)],['Team',r=>esc(r.team)],['Game',r=>r.game],['Score',r=>r.score]],br.slice(0,40))}$('#weekSel').addEventListener('change',render);render()}
function initLineup(){const teams=D.teamSummary.map(x=>x.team).sort();$('#lineup').innerHTML=`<div class="controls">${select('labTeam','Your team',teams,teams[0])}${select('labOpp','Opponent',teams,teams[1])}</div><div id="labMetrics"></div><div class="grid split"><div class="card"><h2>Recommended five</h2><div id="labFive"></div></div><div class="card"><h2>Roster matchup importance</h2><div id="labRank"></div></div></div>`;function render(){const t=$('#labTeam').value,o=$('#labOpp').value;if(t===o)return;const best=bestLineup(t,o),r=roster(t),base=best.m.points,importance=r.map(b=>{const repl=r.filter(x=>x.name!==b.name).slice(0,5);const imp=best.lineup.some(x=>x.name===b.name)&&repl.length===5?Math.max(0,base-matchup(repl,roster(o).slice(0,5)).points):0;return {...b,importance:imp}}).sort((a,b)=>b.importance-a.importance||b.predHdcp-a.predHdcp);$('#labMetrics').innerHTML=metrics([['Expected match points',best.m.points.toFixed(2)+' / 5',`${(best.m.game*100).toFixed(1)}% game win`],['Series win probability',(best.m.series*100).toFixed(1)+'%','Model estimate'],['Projected HDCP',fmt(best.m.our),`Opponent ${fmt(best.m.their)}`],['Lineup volatility',fmt(best.m.sd),'Lower = steadier']]);$('#labFive').innerHTML=tbl([['Bowler',x=>esc(x.name)],['Avg',x=>fmt(x.avg)],['Recent 9',x=>fmt(x.recent)],['Proj HDCP',x=>fmt(x.predHdcp)]],best.lineup);$('#labRank').innerHTML=tbl([['Bowler',x=>esc(x.name)],['Importance',x=>x.importance.toFixed(3)],['Proj HDCP',x=>fmt(x.predHdcp)],['Consistency',x=>x.consistencyRating??'—']],importance)}function sync(){const t=$('#labTeam').value;[...$('#labOpp').options].forEach(o=>o.disabled=o.value===t);if($('#labOpp').value===t)$('#labOpp').value=teams.find(x=>x!==t);render()}$('#labTeam').addEventListener('change',sync);$('#labOpp').addEventListener('change',render);sync()}
function initSimulator(){const teams=D.teamSummary.map(x=>x.team).sort();$('#sim').innerHTML=`<div class="controls">${select('simTeam','Your team',teams,teams[0])}${select('simOpp','Opponent',teams,teams[1])}</div><div id="simMetrics"></div><div class="card"><h2>Select five bowlers</h2><div class="bowlerlist" id="simRoster"></div><div class="note">Select up to five bowlers. Projection updates automatically.</div></div>`;function populate(){const r=roster($('#simTeam').value);$('#simRoster').innerHTML=`<div class="bowlerrow head"><span></span><span>Bowler</span><span>Avg</span><span>Recent 9</span><span class="hide-sm">HDCP</span><span class="hide-sm">Proj</span></div>`+r.map((b,i)=>`<label class="bowlerrow"><input type="checkbox" name="simBowler" value="${esc(b.name)}" ${i<5?'checked':''}><span>${esc(b.name)}</span><span>${fmt(b.avg)}</span><span>${fmt(b.recent)}</span><span class="hide-sm">${b.currentHdcp}</span><span class="hide-sm">${fmt(b.predHdcp)}</span></label>`).join('');render()}function selected(){const set=new Set([...document.querySelectorAll('input[name="simBowler"]:checked')].map(x=>x.value));return roster($('#simTeam').value).filter(b=>set.has(b.name))}function render(){const a=selected(),o=roster($('#simOpp').value).slice(0,5);if(a.length!==5){$('#simMetrics').innerHTML=metrics([['Selected',a.length+' / 5','Choose exactly five bowlers'],['Expected points','—','Requires five'],['Series win','—','Requires five'],['Projected HDCP','—','Requires five']]);return}const m=matchup(a,o);$('#simMetrics').innerHTML=metrics([['Expected match points',m.points.toFixed(2)+' / 5',`${(m.game*100).toFixed(1)}% game win`],['Series win probability',(m.series*100).toFixed(1)+'%','Model estimate'],['Projected HDCP',fmt(m.our),`Opponent ${fmt(m.their)}`],['Lineup volatility',fmt(m.sd),'Estimated team σ']])}function teamChange(){const t=$('#simTeam').value;[...$('#simOpp').options].forEach(o=>o.disabled=o.value===t);if($('#simOpp').value===t)$('#simOpp').value=teams.find(x=>x!==t);populate()}$('#simTeam').addEventListener('change',teamChange);$('#simOpp').addEventListener('change',render);$('#simRoster').addEventListener('change',e=>{if(e.target.name==='simBowler'){const checked=document.querySelectorAll('input[name="simBowler"]:checked');if(checked.length>5)e.target.checked=false;render()}});teamChange()}
function initBIR(){const teams=D.teamSummary.map(x=>x.team).sort();$('#bir').innerHTML=`<div class="controls">${select('birTeam','Team',['All teams',...teams],'All teams')}<div class="control"><label for="birBowler">Bowler</label><select id="birBowler"></select></div></div><div id="birMetrics"></div><div class="grid split"><div class="card"><h2>Selected bowler BIR by week</h2><div id="birHistory"></div></div><div class="card"><h2>Team BIR ranking</h2><div id="birTeamRank"></div></div></div><div class="card"><h2>League BIR leaderboard</h2><div id="birLeague"></div></div>`;function filtered(){const t=$('#birTeam').value;return BIR.summary.filter(b=>t==='All teams'||b.team===t)}function populate(){const list=filtered();$('#birBowler').innerHTML=list.map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');render()}function render(){const list=filtered(),b=list.find(x=>x.name===$('#birBowler').value)||list[0];if(!b)return;const rank=BIR.summary.findIndex(x=>x.name===b.name)+1;$('#birMetrics').innerHTML=metrics([['BIR',b.bir.toFixed(2),`#${rank} league`],['BIR / Week',b.birPerWeek.toFixed(3),`${b.weeks} weeks`],['HDCP performance',fmt(b.hdcpAvg),`${fmt(b.hdcpAvg-BIR.repl)} vs replacement`],['Playing time',b.games+' games',`${b.weeks} weeks`]]);$('#birHistory').innerHTML=tbl([['Week',r=>'W'+r.week],['Scratch Avg',r=>fmt(r.scratchAvg)],['HDCP Avg',r=>fmt(r.hdcpAvg)],['Weekly BIR',r=>r.weekBir.toFixed(3)],['Cum BIR',r=>r.cumBir.toFixed(3)]],b.rows);$('#birTeamRank').innerHTML=tbl([['Bowler',r=>esc(r.name)],['BIR',r=>r.bir.toFixed(2)],['BIR/Wk',r=>r.birPerWeek.toFixed(3)],['Weeks',r=>r.weeks]],list.slice().sort((a,b)=>b.bir-a.bir));$('#birLeague').innerHTML=tbl([['Rank',r=>r.rank],['Bowler',r=>esc(r.name)],['Team',r=>esc(r.team)],['BIR',r=>r.bir.toFixed(2)],['BIR/Wk',r=>r.birPerWeek.toFixed(3)],['Weeks',r=>r.weeks]],BIR.summary.map((r,i)=>({...r,rank:i+1})))}$('#birTeam').addEventListener('change',populate);$('#birBowler').addEventListener('change',render);populate()}
function buildWinPct(){const out=[];for(const b of D.bowlerSummary){const weeks=[...new Set(actualGames(b.name).map(g=>g.week))];let w=0,l=0,t=0,pts=0,n=0;for(const wk of weeks){const g=actualGames(b.name).find(x=>x.week===wk);const r=g&&IDX.teamRec.get(`${wk}|${g.team}`);if(!r)continue;const p=+r.points;pts+=p;n++;if(p>2.5)w++;else if(p<2.5)l++;else t++}if(n)out.push({name:b.name,team:currentTeam(b.name),wins:w,losses:l,ties:t,matches:n,winPct:100*(w+.5*t)/n,avgPoints:pts/n,avg:b.avg,bir:BIR.summary.find(x=>x.name===b.name)?.bir||0})}return out.sort((a,b)=>b.winPct-a.winPct||b.matches-a.matches)}
function initWinPct(){const W=buildWinPct(),teams=D.teamSummary.map(x=>x.team).sort();$('#winpct').innerHTML=`<div class="controls">${select('winTeam','Team',['All teams',...teams],'All teams')}</div><div class="card"><h2>Bowler match win percentage</h2><div id="winTable"></div><div class="note">A match counts when the bowler recorded at least one actual game. Win = team earned more than 2.5 points; tie = 2.5 points.</div></div>`;function render(){const t=$('#winTeam').value,a=W.filter(x=>t==='All teams'||x.team===t);$('#winTable').innerHTML=tbl([['Rank',r=>r.rank],['Bowler',r=>esc(r.name)],['Team',r=>esc(r.team)],['Win %',r=>`<b>${r.winPct.toFixed(1)}%</b>`],['W-L-T',r=>`${r.wins}-${r.losses}-${r.ties}`],['Matches',r=>r.matches],['Avg Team Pts',r=>r.avgPoints.toFixed(2)],['Avg',r=>fmt(r.avg)],['BIR',r=>r.bir.toFixed(2)]],a.map((r,i)=>({...r,rank:i+1})))}$('#winTeam').addEventListener('change',render);render()}
function initMethod(){ $('#method').innerHTML=`<div class="card"><h2>Methodology</h2><p class="muted">Actual games exclude absent and vacant scores. Consistency uses population standard deviation of actual games, converted to a league percentile rating. Projections blend 70% season average with 30% recent-nine average and add current estimated handicap. Match probabilities use each selected bowler's observed score volatility. BIR is a cumulative expected match-point contribution above a replacement-level handicap-adjusted bowler.</p><p class="muted">This GitHub Pages build loads the bowling database from <code>data.json</code> after the page shell renders, which keeps the site responsive and makes weekly data updates easier.</p></div>` }
function initTab(name){const sec=$('#'+name);if(sec.dataset.ready)return;sec.dataset.ready='1';({overview:renderOverview,teams:initTeams,bowlers:initBowlers,weekly:initWeekly,lineup:initLineup,sim:initSimulator,bir:initBIR,winpct:initWinPct,method:initMethod}[name]||(()=>{}))()}
function setupTabs(){for(const b of document.querySelectorAll('.tab'))b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===b.dataset.pane));initTab(b.dataset.pane)})}
async function start(){try{const r=await fetch('./data.json',{cache:'no-store'});if(!r.ok)throw new Error(`Could not load data.json (${r.status})`);D=await r.json();$('#loadStatus').textContent='Building indexes…';await new Promise(requestAnimationFrame);buildIndexes();buildBIR();$('#startup').remove();$('#subtitle').textContent=`${D.meta.league} • Weeks 1–${D.meta.weeks} • Through ${D.meta.through}`;$('#loadStatus').textContent=`${D.bowlerGames.length.toLocaleString()} game records loaded`;setupTabs();initTab('overview')}catch(e){$('#startup').className='card error';$('#startup').textContent='Dashboard data could not be loaded. Make sure index.html and data.json are in the same GitHub repository folder.\n\n'+e.message;$('#loadStatus').textContent='Load failed';console.error(e)}}
start();
})();
</script>
