<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ozark Lanes OBM Bowling Analytics</title>
<style>
:root{--bg:#0b1020;--panel:#121a2b;--panel2:#182238;--text:#f5f7fb;--muted:#9eabc0;--line:#29364f;--accent:#54d48a;--accent2:#5aa7ff;--warn:#f3bb4f;--bad:#ff6b7a}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}button,select,input{font:inherit}.wrap{max-width:1500px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:16px}.hero h1{margin:0;font-size:28px}.heroRight{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.muted{color:var(--muted)}.status{padding:8px 11px;border:1px solid var(--line);background:var(--panel);border-radius:10px;color:var(--muted);font-size:13px}.seasonCtl label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.seasonCtl select{border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);padding:7px 28px 7px 10px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 11px;border-radius:9px;cursor:pointer}.tab.active{background:var(--accent);color:#06130c;border-color:var(--accent)}.pane{display:none}.pane.active{display:block}.grid{display:grid;gap:12px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:12px}.metric,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.metric{padding:14px}.metric .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.metric .v{font-size:24px;font-weight:700;margin:5px 0}.metric .d{font-size:12px;color:var(--muted)}.card{padding:14px;margin-bottom:12px}.card h2,.card h3{margin:0 0 10px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.control{min-width:190px;flex:1}.control label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.control select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:8px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.table th:first-child,.table td:first-child,.table th:nth-child(2),.table td:nth-child(2){text-align:left}.table th{position:sticky;top:0;background:var(--panel2);color:var(--muted);z-index:1}.chartbox{height:330px;position:relative}.chartbox canvas{width:100%;height:100%}.split{grid-template-columns:1.15fr .85fr}.bowlerlist{display:grid;gap:5px}.bowlerrow{display:grid;grid-template-columns:20px minmax(150px,1.8fr) repeat(4,minmax(70px,.7fr));align-items:center;gap:8px;padding:7px 8px;border-bottom:1px solid var(--line);font-size:13px}.bowlerrow.head{color:var(--muted);font-size:12px;font-weight:700}.bowlerrow input[type=checkbox]{width:14px!important;height:14px!important;min-width:14px!important;margin:0}.loading{padding:28px;text-align:center;color:var(--muted)}.error{color:var(--bad);white-space:pre-wrap}.note{font-size:12px;color:var(--muted);margin-top:8px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.dot.green{background:var(--accent)}.dot.blue{background:var(--accent2)}@media(max-width:900px){.metrics,.split{grid-template-columns:1fr 1fr}.bowlerrow{grid-template-columns:20px minmax(130px,1fr) repeat(2,70px)}.hide-sm{display:none}}@media(max-width:600px){.wrap{padding:10px}.hero{display:block}.heroRight{margin-top:10px}.metrics,.split{grid-template-columns:1fr 1fr}.metric .v{font-size:20px}.control{min-width:150px}}
</style></head>
<body><div class="wrap">
<div class="hero"><div><h1>Ozark Lanes OBM Bowling Analytics</h1><div class="muted" id="subtitle">Loading bowling data…</div></div><div class="heroRight"><div class="seasonCtl"><label for="seasonSel">Season</label><select id="seasonSel"></select></div><div class="status" id="loadStatus">Loading data.json…</div></div></div>
<div class="tabs"><button class="tab active" data-pane="overview">Overview</button><button class="tab" data-pane="teams">Teams</button><button class="tab" data-pane="bowlers">Bowlers</button><button class="tab" data-pane="weekly">Weekly Results</button><button class="tab" data-pane="recap">Recap Leaders</button><button class="tab" data-pane="lineup">Lineup Lab</button><button class="tab" data-pane="sim">Matchup Simulator</button><button class="tab" data-pane="bir">BIR / WAR</button><button class="tab" data-pane="winpct">Bowler Win %</button><button class="tab" data-pane="method">Methodology</button></div>
<div id="startup" class="card loading">Loading bowling data…</div>
<section id="overview" class="pane active"></section><section id="teams" class="pane"></section><section id="bowlers" class="pane"></section><section id="weekly" class="pane"></section><section id="recap" class="pane"></section><section id="lineup" class="pane"></section><section id="sim" class="pane"></section><section id="bir" class="pane"></section><section id="winpct" class="pane"></section><section id="method" class="pane"></section>
</div>
<script>
(()=>{'use strict';let D=null,C=null,BIR=null,SEASON='26/27';
const $=s=>document.querySelector(s),fmt=(n,d=1)=>n==null||!Number.isFinite(+n)?'—':(+n).toLocaleString(undefined,{maximumFractionDigits:d});
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function tbl(cols,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function metrics(items){return `<div class="grid metrics">${items.map(x=>`<div class="metric"><div class="k">${x[0]}</div><div class="v">${x[1]}</div><div class="d">${x[2]||''}</div></div>`).join('')}</div>`}
function select(id,label,options,value){return `<div class="control"><label for="${id}">${label}</label><select id="${id}">${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function sRecords(){return SEASON==='All Seasons'?D.teamRecords:D.teamRecords.filter(r=>r.season===SEASON)}function sGames(){return SEASON==='All Seasons'?D.bowlerGames:D.bowlerGames.filter(g=>g.season===SEASON)}function chron(a){return a.slice().sort((x,y)=>String(x.season).localeCompare(String(y.season))||x.week-y.week||(x.game||0)-(y.game||0))}
function computeContext(){const rs=sRecords(),gs=sGames(),gamesByBowler=new Map(),teamRec=new Map(),currentRoster=new Map();for(const r of rs)teamRec.set(`${r.season}|${r.week}|${r.team}`,r);for(const g of gs){if(g.status!=='actual')continue;if(!gamesByBowler.has(g.name))gamesByBowler.set(g.name,[]);gamesByBowler.get(g.name).push(g)}for(const [n,a] of gamesByBowler){a.sort((x,y)=>x.date.localeCompare(y.date)||x.game-y.game);const t=a[a.length-1].team;if(!currentRoster.has(t))currentRoster.set(t,[]);currentRoster.get(t).push(n)}
 const bowlerSummary=[];for(const [name,a] of gamesByBowler){const scores=a.map(g=>g.score),avg=scores.reduce((s,x)=>s+x,0)/scores.length,cons=Math.sqrt(scores.reduce((s,x)=>s+(x-avg)**2,0)/scores.length);const groups=new Map();for(const g of a){const k=`${g.season}|${g.week}`;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(g.score)}const highSeries=Math.max(...[...groups.values()].filter(x=>x.length>=3).map(x=>x.slice(0,3).reduce((s,v)=>s+v,0)),0);bowlerSummary.push({name,team:a[a.length-1].team,games:scores.length,avg,high_game:Math.max(...scores),high_series:highSeries||null,consistency:cons,latest_old_avg:a[a.length-1].old_avg})}bowlerSummary.sort((a,b)=>b.avg-a.avg);
 const teamNames=[...new Set(rs.map(r=>r.team))].sort(),teamSummary=[];for(const t of teamNames){const tr=rs.filter(r=>r.team===t),points=tr.reduce((s,r)=>s+(+r.points||0),0),scratch=tr.filter(r=>Number.isFinite(+r.scratch_total)),hd=tr.filter(r=>Number.isFinite(+r.hdcp_total));teamSummary.push({team:t,points,scratch_avg:scratch.length?scratch.reduce((s,r)=>s+r.scratch_total,0)/scratch.length:null,hdcp_avg:hd.length?hd.reduce((s,r)=>s+r.hdcp_total,0)/hd.length:null,latest_points:tr.length?tr[tr.length-1].points:0})}teamSummary.sort((a,b)=>b.points-a.points);teamSummary.forEach((x,i)=>x.rank=i+1);
 const consistencyPool=bowlerSummary.filter(b=>b.games>=15&&Number.isFinite(b.consistency)).map(b=>b.consistency).sort((a,b)=>a-b);C={rs,gs,gamesByBowler,teamRec,currentRoster,bowlerSummary,summaryByBowler:new Map(bowlerSummary.map(x=>[x.name,x])),teamSummary,consistencyPool};buildBIR()}
function actualGames(name){return C.gamesByBowler.get(name)||[]}function currentTeam(name){const a=actualGames(name);return a.length?a[a.length-1].team:''}function recentAvg(name,n=9){const a=actualGames(name).slice(-n);return a.length?a.reduce((s,g)=>s+g.score,0)/a.length:null}function currentHdcp(avg){return Math.max(0,Math.floor((220-avg)*.9))}function consistencyRating(b){const q=C.consistencyPool;if(!b||b.games<15||!Number.isFinite(b.consistency)||!q.length)return null;let better=0;for(const x of q)if(x>b.consistency)better++;return Math.round(100*better/Math.max(1,q.length-1))}function projection(b){const r=recentAvg(b.name),predScratch=r==null?b.avg:.7*b.avg+.3*r,h=currentHdcp(Number.isFinite(b.latest_old_avg)?b.latest_old_avg:b.avg);return {...b,recent:r,predScratch,predHdcp:predScratch+h,currentHdcp:h,sigma:Math.max(12,b.consistency||25),consistencyRating:consistencyRating(b)}}function roster(team){let names=C.currentRoster.get(team)||[],a=names.map(n=>C.summaryByBowler.get(n)).filter(Boolean).map(projection);return a.sort((a,b)=>b.predHdcp-a.predHdcp)}
function erf(x){const s=x>=0?1:-1;x=Math.abs(x);const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911,t=1/(1+p*x);return s*(1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x))}function normcdf(z){return .5*(1+erf(z/Math.sqrt(2)))}function lineupStats(a){return {mean:a.reduce((s,b)=>s+b.predHdcp,0),variance:a.reduce((s,b)=>s+b.sigma*b.sigma,0)}}function matchup(a,b){const A=lineupStats(a),B=lineupStats(b),sd=Math.sqrt(A.variance+B.variance),p=normcdf((A.mean-B.mean)/Math.max(1,sd)),ps=normcdf((3*(A.mean-B.mean))/Math.max(1,Math.sqrt(3)*sd));return {game:p,series:ps,points:3*p+2*ps,our:A.mean,their:B.mean,sd:Math.sqrt(A.variance)}}function combinations(a,k){const out=[];function rec(i,p){if(p.length===k){out.push(p.slice());return}for(let j=i;j<=a.length-(k-p.length);j++){p.push(a[j]);rec(j+1,p);p.pop()}}rec(0,[]);return out}function bestLineup(team,opp){const r=roster(team),opp5=roster(opp).slice(0,5);if(r.length<=5)return {lineup:r.slice(0,5),m:matchup(r.slice(0,5),opp5)};let best=null;for(const c of combinations(r.slice(0,10),5)){const m=matchup(c,opp5);if(!best||m.points>best.m.points)best={lineup:c,m}}return best}
function buildBIR(){const hd=[];for(const r of C.rs)for(const x of (r.hdcp_games||[]))if(Number.isFinite(+x))hd.push(+x);const teamMean=hd.length?hd.reduce((s,x)=>s+x,0)/hd.length:1000,teamSd=hd.length?Math.sqrt(hd.reduce((s,x)=>s+(x-teamMean)**2,0)/hd.length):80;const quals=C.bowlerSummary.filter(b=>b.games>=Math.min(15,Math.max(3,Math.floor(C.gs.length/100)))).map(b=>b.avg+currentHdcp(b.latest_old_avg)).sort((a,b)=>a-b);const repl=quals.length?quals[Math.floor(.25*(quals.length-1))]:210;const summary=[];for(const b of C.bowlerSummary){const gs=actualGames(b.name),groups=new Map();for(const g of gs){const k=`${g.season}|${g.week}`;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(g)}let cum=0;const rows=[];for(const [k,a] of [...groups].sort((x,y)=>x[1][0].date.localeCompare(y[1][0].date))){const [season,w]=k.split('|'),scratchAvg=a.reduce((s,g)=>s+g.score,0)/a.length,hdcpAvg=a.reduce((s,g)=>s+g.score+g.hdcp,0)/a.length,diff=hdcpAvg-repl,pinToProb=diff/Math.max(1,teamSd),weekBir=(3*(normcdf(pinToProb)-.5)+2*(normcdf(Math.sqrt(3)*pinToProb)-.5));cum+=weekBir;rows.push({season,week:+w,scratchAvg,hdcpAvg,weekBir,cumBir:cum})}const weeks=rows.length;summary.push({name:b.name,team:currentTeam(b.name),games:b.games,weeks,bir:cum,birPerWeek:weeks?cum/weeks:0,hdcpAvg:gs.length?gs.reduce((s,g)=>s+g.score+g.hdcp,0)/gs.length:0,rows})}summary.sort((a,b)=>b.bir-a.bir);BIR={summary,repl,teamSd}}
function drawTeamChart(canvas,rows){const ctx=canvas.getContext('2d'),dpr=devicePixelRatio||1,w=Math.max(canvas.clientWidth,320),h=Math.max(canvas.clientHeight,260);canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);if(!rows.length){ctx.fillStyle='#9eabc0';ctx.font='13px system-ui';ctx.fillText('No team history available for this selection.',18,32);return}const m={l:48,r:44,t:24,b:38},W=w-m.l-m.r,H=h-m.t-m.b,maxP=Math.max(...rows.map(r=>+r.cumulative_points||0),1),maxR=Math.max(...rows.map(r=>+r.rank||1),1);ctx.strokeStyle='#29364f';ctx.fillStyle='#9eabc0';ctx.font='11px system-ui';for(let i=0;i<=4;i++){const y=m.t+H*i/4;ctx.beginPath();ctx.moveTo(m.l,y);ctx.lineTo(m.l+W,y);ctx.stroke();ctx.fillText(Math.round(maxP*(1-i/4)),5,y+4);ctx.textAlign='right';ctx.fillText(Math.max(1,Math.round(1+(maxR-1)*i/4)),w-4,y+4);ctx.textAlign='left'}const X=i=>m.l+(rows.length===1?W/2:i/(rows.length-1)*W),Yp=p=>m.t+H*(1-(+p||0)/maxP),Yr=r=>m.t+H*((+r||1)-1)/Math.max(1,maxR-1);function line(yfn,color){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2.5;ctx.beginPath();rows.forEach((r,i)=>{const x=X(i),y=yfn(r);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(rows.length>1)ctx.stroke();rows.forEach((r,i)=>{ctx.beginPath();ctx.arc(X(i),yfn(r),4,0,Math.PI*2);ctx.fill()})}line(r=>Yp(r.cumulative_points),'#54d48a');line(r=>Yr(r.rank),'#5aa7ff');ctx.fillStyle='#9eabc0';rows.forEach((r,i)=>{if(i%Math.max(1,Math.ceil(rows.length/8))===0||i===rows.length-1)ctx.fillText(r.label||('W'+r.week),X(i)-12,h-10)});ctx.fillStyle='#54d48a';ctx.fillText('Cumulative points',m.l,14);ctx.fillStyle='#5aa7ff';ctx.textAlign='right';ctx.fillText('Rank (#1 top)',w-m.r,14);ctx.textAlign='left'}
function drawBowlerChart(canvas,rows){const ctx=canvas.getContext('2d'),dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);if(!rows.length)return;const vals=rows.flatMap(r=>[r.weeklyAvg,r.runningAvg]),min=Math.max(60,Math.floor((Math.min(...vals)-15)/10)*10),max=Math.min(300,Math.ceil((Math.max(...vals)+15)/10)*10),m={l:48,r:20,t:18,b:40},W=w-m.l-m.r,H=h-m.t-m.b;ctx.strokeStyle='#29364f';ctx.fillStyle='#9eabc0';ctx.font='11px system-ui';for(let i=0;i<=4;i++){const y=m.t+H*i/4;ctx.beginPath();ctx.moveTo(m.l,y);ctx.lineTo(m.l+W,y);ctx.stroke();ctx.fillText(Math.round(max-(max-min)*i/4),6,y+4)}const X=i=>m.l+(rows.length===1?W/2:i/(rows.length-1)*W),Y=v=>m.t+H*(max-v)/(max-min||1);function line(key,color){ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();rows.forEach((r,i)=>{const x=X(i),y=Y(r[key]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle=color;rows.forEach((r,i)=>{ctx.beginPath();ctx.arc(X(i),Y(r[key]),3,0,Math.PI*2);ctx.fill()})}line('weeklyAvg','#54d48a');line('runningAvg','#5aa7ff');ctx.fillStyle='#9eabc0';rows.forEach((r,i)=>{if(i%Math.max(1,Math.ceil(rows.length/8))===0||i===rows.length-1)ctx.fillText(r.label,X(i)-14,h-10)})}
function teamHistory(team){const recs=C.rs.filter(r=>r.team===team).sort((a,b)=>String(a.season||'').localeCompare(String(b.season||''))||(+a.week||0)-(+b.week||0));if(!recs.length)return[];const rows=[];if(SEASON!=='All Seasons'){let cum=0;for(const r of recs){cum+=+r.points||0;const through=C.rs.filter(x=>(+x.week||0)<= (+r.week||0));const totals={};for(const x of through)totals[x.team]=(totals[x.team]||0)+(+x.points||0);const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));rows.push({season:r.season||SEASON,week:r.week,week_points:+r.points||0,cumulative_points:cum,rank:sorted.findIndex(x=>x[0]===team)+1,label:'W'+r.week})}return rows}let cum=0;for(const r of recs){cum+=+r.points||0;const date=r.date||'';const through=C.rs.filter(x=>!date||(x.date||'')<=date);const totals={};for(const x of through)totals[x.team]=(totals[x.team]||0)+(+x.points||0);const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));rows.push({season:r.season||'',week:r.week,week_points:+r.points||0,cumulative_points:cum,rank:sorted.findIndex(x=>x[0]===team)+1,label:`${r.season||''} W${r.week}`})}return rows}
function renderOverview(){const top=C.teamSummary[0],leaders=C.bowlerSummary.slice(0,10);$('#overview').innerHTML=metrics([['Season',SEASON,SEASON==='All Seasons'?'Career / multi-season view':'Selected season'],['Teams',C.teamSummary.length,`${C.rs.length} team-week records`],['Actual games',C.gs.filter(g=>g.status==='actual').length,`${C.bowlerSummary.length} bowlers`],['Points leader',top?esc(top.team):'—',top?`${fmt(top.points)} points`:'']])+`<div class="grid split"><div class="card"><h2>Team standings</h2>${tbl([['Rank',r=>'#'+r.rank],['Team',r=>esc(r.team)],['Points',r=>fmt(r.points)],['Scratch Avg',r=>fmt(r.scratch_avg)],['HDCP Avg',r=>fmt(r.hdcp_avg)]],C.teamSummary.slice(0,20))}</div><div class="card"><h2>Bowling average leaders</h2>${tbl([['Bowler',r=>esc(r.name)],['Team',r=>esc(r.team)],['Avg',r=>fmt(r.avg)],['Games',r=>r.games],['High',r=>r.high_game]],leaders)}</div></div>`}
function initTeams(){const teams=C.teamSummary.map(x=>x.team).sort();$('#teams').innerHTML=`<div class="controls">${select('teamSel','Team',teams,teams[0])}</div><div id="teamMetrics"></div><div class="card"><h2>Cumulative points & team rank</h2><div class="legend"><span><i class="dot green"></i>Cumulative points</span><span><i class="dot blue"></i>Team rank</span></div><div class="chartbox"><canvas id="teamChart"></canvas></div></div><div class="card"><h2>Weekly history</h2><div id="teamTable"></div></div>`;function render(){const t=$('#teamSel').value,s=C.teamSummary.find(x=>x.team===t),rows=teamHistory(t);$('#teamMetrics').innerHTML=metrics([['Rank','#'+s.rank,`${fmt(s.points)} points`],['Scratch series avg',fmt(s.scratch_avg),'Selected period'],['HDCP series avg',fmt(s.hdcp_avg),'Selected period'],['Latest week points',fmt(s.latest_points),'Most recent appearance']]);drawTeamChart($('#teamChart'),rows);$('#teamTable').innerHTML=tbl([['Season',r=>r.season||SEASON],['Week',r=>'W'+r.week],['Week Pts',r=>fmt(r.week_points)],['Cumulative',r=>fmt(r.cumulative_points)],['Rank',r=>'#'+r.rank]],rows)}$('#teamSel').addEventListener('change',render);render()}
function bowlerWeekRows(name){const gs=actualGames(name),groups=new Map();for(const g of gs){const k=`${g.season}|${g.week}`;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(g)}const rows=[];let season='',sum=0,count=0;for(const [k,a] of [...groups].sort((x,y)=>x[1][0].date.localeCompare(y[1][0].date))){const [s,w]=k.split('|');if(s!==season){season=s;sum=0;count=0}const scores=a.map(g=>g.score),weeklyAvg=scores.reduce((x,v)=>x+v,0)/scores.length;sum+=scores.reduce((x,v)=>x+v,0);count+=scores.length;rows.push({season:s,week:+w,label:SEASON==='All Seasons'?`${s} W${w}`:`W${w}`,weeklyAvg,runningAvg:sum/count,series:scores.reduce((x,v)=>x+v,0),games:scores.length})}return rows}
function initBowlers(){const names=C.bowlerSummary.map(x=>x.name).sort();$('#bowlers').innerHTML=`<div class="controls">${select('bowlerSel','Bowler',names,names[0])}</div><div id="bowlerMetrics"></div><div class="card"><h2>Weekly actual performance vs running average</h2><div class="legend"><span><i class="dot green"></i>Weekly actual average</span><span><i class="dot blue"></i>Running season average</span></div><div class="chartbox"><canvas id="bowlerChart"></canvas></div><div id="bowlerTrend" style="margin-top:12px"></div></div><div class="card"><h2>Game history</h2><div id="bowlerGames"></div></div>`;function render(){const n=$('#bowlerSel').value,b=C.summaryByBowler.get(n),gs=actualGames(n),rows=bowlerWeekRows(n),cr=consistencyRating(b);$('#bowlerMetrics').innerHTML=metrics([['Average',fmt(b.avg),`${b.games} actual games`],['High game',b.high_game,'Selected period'],['High series',b.high_series||'—','3-game series'],['Consistency',cr==null?'Provisional':cr+'/100',`σ ${fmt(b.consistency)}`]]);drawBowlerChart($('#bowlerChart'),rows);$('#bowlerTrend').innerHTML=tbl([['Season',r=>r.season],['Week',r=>'W'+r.week],['Weekly Actual Avg',r=>fmt(r.weeklyAvg)],['Running Avg',r=>fmt(r.runningAvg)],['Series',r=>r.series],['Games',r=>r.games]],rows);$('#bowlerGames').innerHTML=tbl([['Season',r=>r.season],['Week',r=>'W'+r.week],['Team',r=>esc(r.team)],['Opponent',r=>esc(r.opponent)],['Game',r=>r.game],['Score',r=>r.score],['HDCP',r=>r.hdcp]],gs)}$('#bowlerSel').addEventListener('change',render);render()}
function initWeekly(){const keys=[...new Set(C.rs.map(r=>`${r.season}|${r.week}`))].sort((a,b)=>{const [sa,wa]=a.split('|'),[sb,wb]=b.split('|');return sa.localeCompare(sb)||+wa-+wb});const labels=keys.map(k=>{const [s,w]=k.split('|');return SEASON==='All Seasons'?`${s} • Week ${w}`:`Week ${w}`});$('#weekly').innerHTML=`<div class="controls">${select('weekSel','Week',labels,labels[labels.length-1])}</div><div id="weekTeams"></div><div class="card"><h2>Bowler results</h2><div id="weekBowlers"></div></div>`;function render(){const ix=labels.indexOf($('#weekSel').value),key=keys[ix],[s,w]=key.split('|'),rs=C.rs.filter(r=>r.season===s&&r.week===+w).sort((a,b)=>(b.points||0)-(a.points||0)),br=C.gs.filter(g=>g.season===s&&g.week===+w&&g.status==='actual').sort((a,b)=>b.score-a.score);$('#weekTeams').innerHTML=`<div class="card"><h2>${s} Week ${w} team results</h2>${tbl([['Team',r=>esc(r.team)],['Opponent',r=>esc(r.opponent)],['Points',r=>fmt(r.points)],['G1 Pts',r=>fmt(r.points_games?.[0])],['G2 Pts',r=>fmt(r.points_games?.[1])],['G3 Pts',r=>fmt(r.points_games?.[2])],['Scratch Series',r=>fmt(r.scratch_total)],['HDCP Series',r=>fmt(r.hdcp_total)]],rs)}</div>`;$('#weekBowlers').innerHTML=tbl([['Bowler',r=>esc(r.name)],['Team',r=>esc(r.team)],['Game',r=>r.game],['Score',r=>r.score]],br.slice(0,80))}$('#weekSel').addEventListener('change',render);render()}
function initRecap(){
 const topN=10;
 function tag(r){return SEASON==='All Seasons'?`${esc(r.season)} • W${r.week}`:`W${r.week}`}
 const indivGames=[],seriesMap=new Map();
 for(const g of C.gs){if(g.status!=='actual'||!Number.isFinite(+g.score))continue;indivGames.push({season:g.season,week:g.week,name:g.name,team:g.team,scratch:+g.score,hdcp:+g.score+(+g.hdcp||0)});const k=`${g.season}|${g.week}|${g.team}|${g.name}`;if(!seriesMap.has(k))seriesMap.set(k,[]);seriesMap.get(k).push(g)}
 const indivSeries=[];for(const a of seriesMap.values()){a.sort((x,y)=>x.game-y.game);if(a.length<3)continue;const b=a[0],scratch=a.slice(0,3).reduce((s,g)=>s+(+g.score||0),0),hdcp=a.slice(0,3).reduce((s,g)=>s+(+g.score||0)+(+g.hdcp||0),0);indivSeries.push({season:b.season,week:b.week,name:b.name,team:b.team,scratch,hdcp})}
 const teamGames=[],teamSeries=[];for(const r of C.rs){for(let i=0;i<3;i++){if(Number.isFinite(+r.scratch_games?.[i]))teamGames.push({season:r.season,week:r.week,team:r.team,scratch:+r.scratch_games[i],hdcp:+r.hdcp_games?.[i]})}if(Number.isFinite(+r.scratch_total))teamSeries.push({season:r.season,week:r.week,team:r.team,scratch:+r.scratch_total,hdcp:+r.hdcp_total})}
 const top=(a,k)=>a.filter(x=>Number.isFinite(+x[k])).sort((x,y)=>y[k]-x[k]||String(x.name||x.team).localeCompare(String(y.name||y.team))).slice(0,topN);
 const iCols=[['Rank',r=>'#'+r.rank],['Bowler',r=>esc(r.name)],['Team',r=>esc(r.team)],['Score',r=>`<b>${fmt(r.value,0)}</b>`],['When',r=>tag(r)]];
 const tCols=[['Rank',r=>'#'+r.rank],['Team',r=>esc(r.team)],['Score',r=>`<b>${fmt(r.value,0)}</b>`],['When',r=>tag(r)]];
 function rankRows(a,k){return top(a,k).map((r,i)=>({...r,rank:i+1,value:r[k]}))}
 $('#recap').innerHTML=`<div class="card"><h2>Individual recap leaders</h2><div class="note">Top ${topN} performances for the selected season view. Series require three actual games.</div></div><div class="grid split"><div class="card"><h3>Top Scratch Games</h3>${tbl(iCols,rankRows(indivGames,'scratch'))}</div><div class="card"><h3>Top Scratch Series</h3>${tbl(iCols,rankRows(indivSeries,'scratch'))}</div><div class="card"><h3>Top Handicap Games</h3>${tbl(iCols,rankRows(indivGames,'hdcp'))}</div><div class="card"><h3>Top Handicap Series</h3>${tbl(iCols,rankRows(indivSeries,'hdcp'))}</div></div><div class="card"><h2>Team recap leaders</h2></div><div class="grid split"><div class="card"><h3>Top Scratch Games</h3>${tbl(tCols,rankRows(teamGames,'scratch'))}</div><div class="card"><h3>Top Scratch Series</h3>${tbl(tCols,rankRows(teamSeries,'scratch'))}</div><div class="card"><h3>Top Handicap Games</h3>${tbl(tCols,rankRows(teamGames,'hdcp'))}</div><div class="card"><h3>Top Handicap Series</h3>${tbl(tCols,rankRows(teamSeries,'hdcp'))}</div></div>`
}
function initLineup(){const teams=C.teamSummary.map(x=>x.team).filter(t=>roster(t).length>=5).sort();$('#lineup').innerHTML=`<div class="controls">${select('labTeam','Your team',teams,teams[0])}${select('labOpp','Opponent',teams,teams[1])}</div><div id="labMetrics"></div><div class="grid split"><div class="card"><h2>Recommended five</h2><div id="labFive"></div></div><div class="card"><h2>Roster matchup importance</h2><div id="labRank"></div></div></div>`;function render(){const t=$('#labTeam').value,o=$('#labOpp').value;if(!t||!o||t===o)return;const best=bestLineup(t,o),r=roster(t);if(!best||best.lineup.length<5){$('#labMetrics').innerHTML='<div class="card muted">Not enough roster history for a five-bowler projection.</div>';return}const base=best.m.points,importance=r.map(b=>{const repl=r.filter(x=>x.name!==b.name).slice(0,5);const imp=best.lineup.some(x=>x.name===b.name)&&repl.length===5?Math.max(0,base-matchup(repl,roster(o).slice(0,5)).points):0;return {...b,importance:imp}}).sort((a,b)=>b.importance-a.importance||b.predHdcp-a.predHdcp);$('#labMetrics').innerHTML=metrics([['Expected match points',best.m.points.toFixed(2)+' / 5',`${(best.m.game*100).toFixed(1)}% game win`],['Series win probability',(best.m.series*100).toFixed(1)+'%','Model estimate'],['Projected HDCP',fmt(best.m.our),`Opponent ${fmt(best.m.their)}`],['Lineup volatility',fmt(best.m.sd),'Lower = steadier']]);$('#labFive').innerHTML=tbl([['Bowler',x=>esc(x.name)],['Avg',x=>fmt(x.avg)],['Recent 9',x=>fmt(x.recent)],['Proj HDCP',x=>fmt(x.predHdcp)]],best.lineup);$('#labRank').innerHTML=tbl([['Bowler',x=>esc(x.name)],['Importance',x=>x.importance.toFixed(3)],['Proj HDCP',x=>fmt(x.predHdcp)],['Consistency',x=>x.consistencyRating??'—']],importance)}function sync(){const t=$('#labTeam').value;[...$('#labOpp').options].forEach(o=>o.disabled=o.value===t);if($('#labOpp').value===t)$('#labOpp').value=teams.find(x=>x!==t)||'';render()}$('#labTeam').addEventListener('change',sync);$('#labOpp').addEventListener('change',render);sync()}
function initSimulator(){const teams=C.teamSummary.map(x=>x.team).filter(t=>roster(t).length>=5).sort();$('#sim').innerHTML=`<div class="controls">${select('simTeam','Your team',teams,teams[0])}${select('simOpp','Opponent',teams,teams[1])}</div><div id="simMetrics"></div><div class="card"><h2>Select five bowlers</h2><div class="bowlerlist" id="simRoster"></div><div class="note">Select up to five bowlers. Projection updates automatically.</div></div>`;function populate(){const r=roster($('#simTeam').value);$('#simRoster').innerHTML=`<div class="bowlerrow head"><span></span><span>Bowler</span><span>Avg</span><span>Recent 9</span><span class="hide-sm">HDCP</span><span class="hide-sm">Proj</span></div>`+r.map((b,i)=>`<label class="bowlerrow"><input type="checkbox" name="simBowler" value="${esc(b.name)}" ${i<5?'checked':''}><span>${esc(b.name)}</span><span>${fmt(b.avg)}</span><span>${fmt(b.recent)}</span><span class="hide-sm">${b.currentHdcp}</span><span class="hide-sm">${fmt(b.predHdcp)}</span></label>`).join('');render()}function selected(){const set=new Set([...document.querySelectorAll('input[name="simBowler"]:checked')].map(x=>x.value));return roster($('#simTeam').value).filter(b=>set.has(b.name))}function render(){const a=selected(),o=roster($('#simOpp').value).slice(0,5);if(a.length!==5||o.length!==5){$('#simMetrics').innerHTML=metrics([['Selected',a.length+' / 5','Choose exactly five bowlers'],['Expected points','—','Requires five'],['Series win','—','Requires five'],['Projected HDCP','—','Requires five']]);return}const m=matchup(a,o);$('#simMetrics').innerHTML=metrics([['Expected match points',m.points.toFixed(2)+' / 5',`${(m.game*100).toFixed(1)}% game win`],['Series win probability',(m.series*100).toFixed(1)+'%','Model estimate'],['Projected HDCP',fmt(m.our),`Opponent ${fmt(m.their)}`],['Lineup volatility',fmt(m.sd),'Estimated team σ']])}function teamChange(){const t=$('#simTeam').value;[...$('#simOpp').options].forEach(o=>o.disabled=o.value===t);if($('#simOpp').value===t)$('#simOpp').value=teams.find(x=>x!==t)||'';populate()}$('#simTeam').addEventListener('change',teamChange);$('#simOpp').addEventListener('change',render);$('#simRoster').addEventListener('change',e=>{if(e.target.name==='simBowler'){const checked=document.querySelectorAll('input[name="simBowler"]:checked');if(checked.length>5)e.target.checked=false;render()}});teamChange()}
function initBIR(){const teams=C.teamSummary.map(x=>x.team).sort();$('#bir').innerHTML=`<div class="controls">${select('birTeam','Team',['All teams',...teams],'All teams')}<div class="control"><label for="birBowler">Bowler</label><select id="birBowler"></select></div></div><div id="birMetrics"></div><div class="grid split"><div class="card"><h2>Selected bowler BIR by week</h2><div id="birHistory"></div></div><div class="card"><h2>Team BIR ranking</h2><div id="birTeamRank"></div></div></div><div class="card"><h2>League BIR leaderboard</h2><div id="birLeague"></div></div>`;function filtered(){const t=$('#birTeam').value;return BIR.summary.filter(b=>t==='All teams'||b.team===t)}function populate(){const list=filtered();$('#birBowler').innerHTML=list.map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');render()}function render(){const list=filtered(),b=list.find(x=>x.name===$('#birBowler').value)||list[0];if(!b){$('#birMetrics').innerHTML='<div class="card muted">No bowler data in this selection.</div>';return}const rank=BIR.summary.findIndex(x=>x.name===b.name)+1;$('#birMetrics').innerHTML=metrics([['BIR',b.bir.toFixed(2),`#${rank} selected period`],['BIR / Week',b.birPerWeek.toFixed(3),`${b.weeks} weeks`],['HDCP performance',fmt(b.hdcpAvg),`${fmt(b.hdcpAvg-BIR.repl)} vs replacement`],['Playing time',b.games+' games',`${b.weeks} weeks`]]);$('#birHistory').innerHTML=tbl([['Season',r=>r.season],['Week',r=>'W'+r.week],['Scratch Avg',r=>fmt(r.scratchAvg)],['HDCP Avg',r=>fmt(r.hdcpAvg)],['Weekly BIR',r=>r.weekBir.toFixed(3)],['Cum BIR',r=>r.cumBir.toFixed(3)]],b.rows);$('#birTeamRank').innerHTML=tbl([['Bowler',r=>esc(r.name)],['BIR',r=>r.bir.toFixed(2)],['BIR/Wk',r=>r.birPerWeek.toFixed(3)],['Weeks',r=>r.weeks]],list.slice().sort((a,b)=>b.bir-a.bir));$('#birLeague').innerHTML=tbl([['Rank',r=>r.rank],['Bowler',r=>esc(r.name)],['Team',r=>esc(r.team)],['BIR',r=>r.bir.toFixed(2)],['BIR/Wk',r=>r.birPerWeek.toFixed(3)],['Weeks',r=>r.weeks]],BIR.summary.map((r,i)=>({...r,rank:i+1})))}$('#birTeam').addEventListener('change',populate);$('#birBowler').addEventListener('change',render);populate()}
function buildWinPct(){const out=[];for(const b of C.bowlerSummary){const seen=new Map();for(const g of actualGames(b.name)){const k=`${g.season}|${g.week}`;if(!seen.has(k))seen.set(k,g)}let w=0,l=0,t=0,pts=0,n=0;for(const g of seen.values()){const r=C.teamRec.get(`${g.season}|${g.week}|${g.team}`);if(!r)continue;const p=+r.points;pts+=p;n++;if(p>2.5)w++;else if(p<2.5)l++;else t++}if(n)out.push({name:b.name,team:currentTeam(b.name),wins:w,losses:l,ties:t,matches:n,winPct:100*(w+.5*t)/n,avgPoints:pts/n,avg:b.avg,bir:BIR.summary.find(x=>x.name===b.name)?.bir||0})}return out.sort((a,b)=>b.winPct-a.winPct||b.matches-a.matches)}
function initWinPct(){const W=buildWinPct(),teams=C.teamSummary.map(x=>x.team).sort();$('#winpct').innerHTML=`<div class="controls">${select('winTeam','Team',['All teams',...teams],'All teams')}</div><div class="card"><h2>Bowler match win percentage</h2><div id="winTable"></div><div class="note">A match counts when the bowler recorded at least one actual game. Win = team earned more than 2.5 points; tie = 2.5 points.</div></div>`;function render(){const t=$('#winTeam').value,a=W.filter(x=>t==='All teams'||x.team===t);$('#winTable').innerHTML=tbl([['Rank',r=>r.rank],['Bowler',r=>esc(r.name)],['Team',r=>esc(r.team)],['Win %',r=>`<b>${r.winPct.toFixed(1)}%</b>`],['W-L-T',r=>`${r.wins}-${r.losses}-${r.ties}`],['Matches',r=>r.matches],['Avg Team Pts',r=>r.avgPoints.toFixed(2)],['Avg',r=>fmt(r.avg)],['BIR',r=>r.bir.toFixed(2)]],a.map((r,i)=>({...r,rank:i+1})))}$('#winTeam').addEventListener('change',render);render()}
function initMethod(){$('#method').innerHTML=`<div class="card"><h2>Methodology</h2><p class="muted">Use the season selector at the top to analyze 2025–26, 2026–27, or all available seasons. Actual games exclude absent, vacant, and zero/no-game scores. The Bowler trend compares each week's actual-game average with the running season average, which resets at the start of each season.</p><p class="muted">Consistency uses population standard deviation of actual games. Projections blend 70% selected-period average with 30% recent-nine average and add current estimated handicap. BIR is cumulative expected match-point contribution above a replacement-level handicap-adjusted bowler.</p><p class="muted">The GitHub Pages build loads the database from <code>data.json</code>, so most future weekly updates only require replacing that file.</p></div>`}
const inits={overview:renderOverview,teams:initTeams,bowlers:initBowlers,weekly:initWeekly,recap:initRecap,lineup:initLineup,sim:initSimulator,bir:initBIR,winpct:initWinPct,method:initMethod};function initTab(name){const sec=$('#'+name);if(sec.dataset.ready)return;sec.dataset.ready='1';inits[name]?.()}function activePane(){return document.querySelector('.tab.active')?.dataset.pane||'overview'}function refreshAll(){computeContext();document.querySelectorAll('.pane').forEach(x=>{x.dataset.ready='';x.innerHTML=''});const maxWeek=SEASON==='All Seasons'?'multi-season':Math.max(...C.rs.map(r=>r.week),0)+' week'+(Math.max(...C.rs.map(r=>r.week),0)===1?'':'s');$('#subtitle').textContent=`${D.meta.center} • ${SEASON} • ${maxWeek} • Through ${D.meta.through}`;$('#loadStatus').textContent=`${C.gs.filter(g=>g.status==='actual').length.toLocaleString()} actual games`;initTab(activePane())}function setupTabs(){document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===b.dataset.pane));initTab(b.dataset.pane)}))}
async function start(){try{const r=await fetch('./data.json',{cache:'no-store'});if(!r.ok)throw new Error(`Could not load data.json (${r.status})`);D=await r.json();const seasons=Array.isArray(D.meta?.seasons)&&D.meta.seasons.length?D.meta.seasons:[...new Set((D.teamRecords||[]).map(x=>x.season||'25/26'))].sort();D.meta=D.meta||{};D.meta.seasons=seasons;SEASON=D.meta.latest_season||seasons.at(-1)||'All Seasons';$('#seasonSel').innerHTML=[...seasons,'All Seasons'].map(s=>`<option value="${s}" ${s===SEASON?'selected':''}>${s}</option>`).join('');$('#seasonSel').addEventListener('change',()=>{SEASON=$('#seasonSel').value;refreshAll()});$('#startup').remove();setupTabs();refreshAll()}catch(e){$('#startup').className='card error';$('#startup').textContent='Dashboard data could not be loaded. Make sure index.html and data.json are in the same GitHub repository folder.\n\n'+e.message;$('#loadStatus').textContent='Load failed';console.error(e)}}start();})();
</script></body></html>
